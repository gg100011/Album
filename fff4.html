<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Другие детали тоже нужны, тут собраны самые характерные.</title>

<style>

*{box-sizing:border-box}

body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
}

header{
    text-align:center;
    padding:15px;
    background:#181818;
    position:sticky;
    top:0;
    z-index:10;
}

h1{
    margin:0 0 5px;
    font-size:21px;
}

#counter{
    color:#aaa;
    font-size:14px;
}

.top-controls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
}

.top-controls button{
    background:#303030;
    color:white;
    border:none;
    border-radius:8px;
    padding:8px 12px;
    font-size:14px;
    border:1px solid #00ff44;
}

.top-controls button:active{
    transform:scale(.96);
}

.viewer{
    padding:15px 10px 20px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
}

#caption{
    width:100%;
    max-width:900px;
    text-align:center;
    font-size:21.6px;
    line-height:1.5;
    margin-bottom:15px;
    padding:0 10px;
    color:#eee;
}

.photo-container{
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

#photo{
    width:100%;
    height:auto;
    max-width:100%;
    border-radius:5px;
    display:block;
    object-fit:contain;
    cursor:pointer;
    user-select:none;
    -webkit-user-drag:none;
    will-change:transform;
}

.gallery{
    width:100%;
    padding:20px 10px 100px;
}

.gallery-group{
    margin-bottom:30px;
}

.gallery-group-title{
    font-size:21.6px;
    font-weight:bold;
    text-align:center;
    margin-bottom:12px;
    color:#eee;
}

.gallery-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

.gallery-item{
    width:100%;
    aspect-ratio:1/1;
    object-fit:cover;
    border-radius:5px;
    cursor:pointer;
    opacity:.75;
    border:3px solid transparent;
}

.gallery-item.active{
    opacity:1;
    border-color:white;
}

.thumbs{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:#181818;
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding:7px;
    z-index:20;
    border:1px solid #00ff44;
}

.thumbs img{
    width:62px;
    height:62px;
    flex:0 0 62px;
    object-fit:cover;
    border-radius:5px;
    opacity:.55;
    cursor:pointer;
}

.thumbs img.active{
    opacity:1;
    outline:2px solid white;
}


/* =========================================
   ПОЛНОЭКРАННЫЙ РЕЖИМ
========================================= */

#fullscreen{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;

    background:rgba(0,0,0,.72);

    display:none;

    align-items:center;
    justify-content:center;

    z-index:999999;

    padding:5px;

    overflow:hidden;

    touch-action:none;

    /*
       Очень важно:
       слой полностью перехватывает
       взаимодействие с элементами позади.
    */
    pointer-events:auto;
}

#fullscreen.show{
    display:flex;
}

#fullscreenPhoto{
    display:block;

    width:100vw;
    height:100vh;

    max-width:100vw;
    max-height:100vh;

    object-fit:contain;

    border-radius:3px;

    user-select:none;
    -webkit-user-drag:none;

    will-change:transform;

    pointer-events:auto;
}


@media(max-width:600px){

    .gallery-grid{
        grid-template-columns:repeat(4,1fr);
        gap:5px;
    }

    .gallery-item{
        border-width:2px;
    }

}

</style>
</head>


<body>


<header>

<h1>
Другие детали тоже нужны, тут собраны самые характерные.
</h1>

<div class="top-controls">

<button onclick="previousPhoto()">
← Назад
</button>

<div id="counter">
Фото 1 из 80
</div>

<button onclick="nextPhoto()">
Вперёд →
</button>

</div>

</header>


<div class="viewer">

<div id="caption"></div>

<div class="photo-container">

<img
    id="photo"
    src="photos/001.jpg"
    alt="Фото 1"
>

</div>

</div>


<div
    class="gallery"
    id="gallery">
</div>


<div
    class="thumbs"
    id="thumbs">
</div>


<!-- =====================================
     ПОЛНОЭКРАННАЯ ФОТОГРАФИЯ
===================================== -->

<div
    id="fullscreen"
    aria-hidden="true"
>

<img
    id="fullscreenPhoto"
    src=""
    alt=""
>

</div>


<script>


/* =========================================
   НАСТРОЙКИ
========================================= */

const TOTAL_PHOTOS=80;


/* =========================================
   ДОПОЛНИТЕЛЬНЫЕ ФОТО
========================================= */

const extraPhotos={

    68:["a","b"]

};


/* =========================================
   ПОДПИСИ
========================================= */

const captions={

    1:"Турели",

    6:"Крюк буксировочный",

    10:"Танковая фара и маскировочные фонари",

    24:"Ведущее колесо",

    27:"Ленивец гусеничной техники, 50 см",

    31:"Диск автомобиля",

    35:"Пехотная тележка",

    39:"Крепления инструмента и оружия",

    43:"Крепления мотоциклетных ящиков",

    48:"баки мотоциклов",

    52:"Бронещит",

    56:"Ящик мотоцикла",

    61:"Характерные немецкие болты",

    63:"Ленивцы танков",

    65:"Колесо пехотные тележки",

    66:"Траки полугусеничных машин и танков",

    72:"Люк с красной грунтовкой",

    73:"Вентиляционная решетка танка",

    74:"Балансиры гусеничных машин",

    78:"Поворотные кулаки",

    79:"Петля люка",

    80:"опорный каток"

};


/* =========================================
   СОЗДАНИЕ СПИСКА ФОТО
========================================= */

const photoFiles=[];


for(let i=1;i<=TOTAL_PHOTOS;i++){

    const number=
        String(i).padStart(3,"0");


    photoFiles.push(
        number+".jpg"
    );


    if(extraPhotos[i]){

        extraPhotos[i].forEach(
            letter=>{

                photoFiles.push(
                    number+
                    letter+
                    ".jpg"
                );

            }
        );

    }

}


/* =========================================
   ПОДПИСЬ
========================================= */

function getCaption(index){

    const match=
        photoFiles[index]
        .match(/^(\d{3})/);


    if(!match)return"";


    const baseNumber=
        Number(match[1]);


    let result="";


    for(const start in captions){

        const startNumber=
            Number(start);


        if(startNumber<=baseNumber){

            result=
                captions[start];

        }

    }


    return result;

}


/* =========================================
   ФОТОГРАФИИ
========================================= */

const photos=
photoFiles.map(
    (file,index)=>({

        file:
            "photos/"+file,

        filename:
            file,

        number:
            index+1,

        caption:
            getCaption(index)

    })
);


/* =========================================
   ЭЛЕМЕНТЫ
========================================= */

let current=0;


const photo=
document.getElementById("photo");


const caption=
document.getElementById("caption");


const counter=
document.getElementById("counter");


const thumbs=
document.getElementById("thumbs");


const gallery=
document.getElementById("gallery");


const fullscreen=
document.getElementById("fullscreen");


const fullscreenPhoto=
document.getElementById("fullscreenPhoto");


/* =========================================
   ПЛИТОЧНАЯ ГАЛЕРЕЯ
========================================= */

let group=null;


photos.forEach(
    (item,index)=>{

        if(
            group===null ||
            group.caption!==item.caption
        ){

            group={

                caption:
                    item.caption,

                container:
                    document.createElement("div"),

                grid:
                    document.createElement("div")

            };


            group.container.className=
                "gallery-group";


            const title=
                document.createElement("div");


            title.className=
                "gallery-group-title";


            title.textContent=
                item.caption;


            group.grid.className=
                "gallery-grid";


            group.container.appendChild(
                title
            );


            group.container.appendChild(
                group.grid
            );


            gallery.appendChild(
                group.container
            );

        }


        const img=
            document.createElement("img");


        img.src=
            item.file;


        img.loading=
            "lazy";


        img.className=
            "gallery-item";


        img.alt=
            item.caption;


        img.dataset.index=
            index;


        img.addEventListener(
            "click",
            function(event){

                event.preventDefault();

                event.stopPropagation();

                showPhoto(index);

                openFullscreenWithHistory(
                    index
                );

            }
        );


        group.grid.appendChild(img);

    }
);


/* =========================================
   НИЖНЯЯ ЛЕНТА
========================================= */

photos.forEach(
    (item,index)=>{

        const img=
            document.createElement("img");


        img.src=
            item.file;


        img.loading=
            "lazy";


        img.addEventListener(
            "click",
            function(event){

                event.preventDefault();

                event.stopPropagation();

                showPhoto(index);

            }
        );


        thumbs.appendChild(
            img
        );

    }
);


/* =========================================
   ПОДГОНКА ОСНОВНОЙ ФОТО
========================================= */

function fitPhotoToScreen(){

    const headerHeight=
        document
        .querySelector("header")
        .offsetHeight;


    const captionHeight=
        caption.offsetHeight;


    const availableHeight=
        window.innerHeight-
        headerHeight-
        captionHeight-
        55;


    photo.style.width=
        "100%";


    photo.style.height=
        "auto";


    photo.style.maxHeight=
        "none";


    if(
        !photo.naturalWidth ||
        !photo.naturalHeight
    ){

        return;

    }


    const availableWidth=
        photo.parentElement.clientWidth;


    const naturalHeight=
        availableWidth*
        photo.naturalHeight/
        photo.naturalWidth;


    if(
        naturalHeight>
        availableHeight
    ){

        photo.style.width=
            "auto";


        photo.style.height=
            availableHeight+
            "px";


        photo.style.maxWidth=
            "100%";

    }

}


/* =========================================
   ПОКАЗ ФОТО
========================================= */

function showPhoto(index){

    if(index<0){

        index=
            photos.length-1;

    }


    if(index>=photos.length){

        index=0;

    }


    current=index;


    const item=
        photos[current];


    photo.style.transition=
        "none";


    photo.style.transform=
        "translateX(0)";


    photo.src=
        item.file;


    photo.alt=
        item.caption;


    caption.textContent=
        item.caption;


    counter.textContent=
        "Фото "+
        (current+1)+
        " из "+
        photos.length;


    photo.onload=
        fitPhotoToScreen;


    /* Нижняя лента */

    document
        .querySelectorAll(".thumbs img")
        .forEach(
            (img,i)=>{

                img.classList.toggle(
                    "active",
                    i===current
                );

            }
        );


    const activeThumb=
        thumbs.children[current];


    if(activeThumb){

        activeThumb.scrollIntoView({

            behavior:
                "smooth",

            inline:
                "center",

            block:
                "nearest"

        });

    }


    /* Плиточная галерея */

    document
        .querySelectorAll(".gallery-item")
        .forEach(
            (img,i)=>{

                img.classList.toggle(
                    "active",
                    i===current
                );

            }
        );

}


/* =========================================
   НАВИГАЦИЯ
========================================= */

function nextPhoto(){

    showPhoto(
        current+1
    );

}


function previousPhoto(){

    showPhoto(
        current-1
    );

}


/* =========================================
   FULLSCREEN
========================================= */

let fullscreenHistory=false;


function openFullscreen(index){

    current=index;


    fullscreenPhoto.style.transition=
        "none";


    fullscreenPhoto.style.transform=
        "translateX(0)";


    fullscreenPhoto.src=
        photos[current].file;


    fullscreen.classList.add(
        "show"
    );


    fullscreen.setAttribute(
        "aria-hidden",
        "false"
    );


    document.body.style.overflow=
        "hidden";

}


function openFullscreenWithHistory(index){

    openFullscreen(index);


    if(!fullscreenHistory){

        history.pushState(
            {fullscreen:true},
            "",
            location.href
        );


        fullscreenHistory=true;

    }

}


function closeFullscreen(){

    if(
        !fullscreen.classList.contains("show")
    ){

        return;

    }


    fullscreen.classList.remove(
        "show"
    );


    fullscreen.setAttribute(
        "aria-hidden",
        "true"
    );


    fullscreenPhoto.src="";


    fullscreenPhoto.style.transform=
        "translateX(0)";


    document.body.style.overflow=
        "";


    fullscreenHistory=false;

}


/* =========================================
   ANDROID BACK
========================================= */

window.addEventListener(
    "popstate",
    function(){

        if(
            fullscreen.classList.contains("show")
        ){

            closeFullscreen();

        }

    }
);


/* =========================================
   ТАП ПО ОСНОВНОЙ ФОТОГРАФИИ
========================================= */

photo.addEventListener(
    "click",
    function(event){

        event.preventDefault();

        event.stopPropagation();

        openFullscreenWithHistory(
            current
        );

    }
);


/* =========================================
   FULLSCREEN — СВАЙП
========================================= */

let fsStartX=0;
let fsStartY=0;
let fsLastX=0;
let fsLastY=0;
let fsTouching=false;


fullscreenPhoto.addEventListener(
    "touchstart",
    function(event){

        if(
            !fullscreen.classList.contains("show")
        ){

            return;

        }


        fsStartX=
            event.touches[0].clientX;


        fsStartY=
            event.touches[0].clientY;


        fsLastX=
            fsStartX;


        fsLastY=
            fsStartY;


        fsTouching=true;


        fullscreenPhoto.style.transition=
            "none";


        /*
           Останавливаем событие здесь.
        */

        event.stopPropagation();

    },
    {passive:true}
);


fullscreenPhoto.addEventListener(
    "touchmove",
    function(event){

        if(!fsTouching)return;


        fsLastX=
            event.touches[0].clientX;


        fsLastY=
            event.touches[0].clientY;


        const dx=
            fsLastX-fsStartX;


        const dy=
            fsLastY-fsStartY;


        if(
            Math.abs(dx)>
            Math.abs(dy)
        ){

            fullscreenPhoto.style.transform=
                "translateX("+
                dx*.45+
                "px)";

        }


        event.stopPropagation();

    },
    {passive:true}
);


fullscreenPhoto.addEventListener(
    "touchend",
    function(event){

        if(!fsTouching)return;


        fsTouching=false;


        const dx=
            fsLastX-fsStartX;


        const dy=
            fsLastY-fsStartY;


        event.stopPropagation();


        /*
           =================================
           ОБЫЧНЫЙ ТАП
           =================================

           Если горизонтальное движение
           меньше 60 px — это тап.

           Сразу закрываем fullscreen.
        */

        if(
            Math.abs(dx)<60 &&
            Math.abs(dy)<60
        ){

            closeFullscreen();

            return;

        }


        /*
           =================================
           СВАЙП
        =================================
        */

        if(
            Math.abs(dx)<
            Math.abs(dy)
        ){

            fullscreenPhoto.style.transition=
                "transform .2s ease";


            fullscreenPhoto.style.transform=
                "translateX(0)";


            return;

        }


        const direction=
            dx<0?-1:1;


        fullscreenPhoto.style.transition=
            "transform .18s ease";


        fullscreenPhoto.style.transform=
            "translateX("+
            direction*
            window.innerWidth+
            "px)";


        setTimeout(
            function(){

                if(direction<0){

                    nextPhoto();

                }else{

                    previousPhoto();

                }


                fullscreenPhoto.src=
                    photos[current].file;


                fullscreenPhoto.style.transition=
                    "none";


                fullscreenPhoto.style.transform=
                    "translateX("+
                    (-direction*
                    window.innerWidth)+
                    "px)";


                requestAnimationFrame(
                    function(){

                        requestAnimationFrame(
                            function(){

                                fullscreenPhoto.style.transition=
                                    "transform .22s ease";


                                fullscreenPhoto.style.transform=
                                    "translateX(0)";

                            }
                        );

                    }
                );

            },
            180
        );

    },
    {passive:true}
);


/* =========================================
   FULLSCREEN — ТАП
========================================= */

/*
   Очень важная часть.

   Мы НЕ используем обычный click
   для fullscreenPhoto.

   Вместо этого любое короткое
   touch-событие закрывается выше.

   Дополнительно блокируем pointer/click,
   чтобы событие никогда не дошло
   до нижней галереи.
*/

fullscreen.addEventListener(
    "click",
    function(event){

        event.preventDefault();

        event.stopPropagation();


        /*
           Если click пришёл по свободному
           месту fullscreen — закрываем.
        */

        if(
            event.target===
            fullscreen
        ){

            closeFullscreen();

        }

    },
    true
);


/*
   Перехватываем pointerdown/up на самом
   верхнем уровне.

   Это не даёт Android передать тап
   элементам, находящимся под fullscreen.
*/

fullscreen.addEventListener(
    "pointerdown",
    function(event){

        event.stopPropagation();

    },
    true
);


fullscreen.addEventListener(
    "pointerup",
    function(event){

        event.stopPropagation();

    },
    true
);


fullscreen.addEventListener(
    "pointercancel",
    function(event){

        event.stopPropagation();

    },
    true
);


/* =========================================
   КЛАВИАТУРА
========================================= */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key==="Escape" &&
            fullscreen.classList.contains("show")
        ){

            closeFullscreen();

            return;

        }


        if(event.key==="ArrowRight"){

            nextPhoto();

        }


        if(event.key==="ArrowLeft"){

            previousPhoto();

        }

    }
);


/* =========================================
   СВАЙП ОСНОВНОЙ ФОТОГРАФИИ
========================================= */

let startX=0;
let startY=0;
let lastX=0;
let dragging=false;


photo.addEventListener(
    "touchstart",
    function(event){

        startX=
            event.touches[0].clientX;

        startY=
            event.touches[0].clientY;

        lastX=
            startX;

        dragging=true;


        photo.style.transition=
            "none";

    },
    {passive:true}
);


photo.addEventListener(
    "touchmove",
    function(event){

        if(!dragging)return;


        lastX=
            event.touches[0].clientX;


        const dx=
            lastX-startX;


        const dy=
            event.touches[0].clientY-startY;


        if(
            Math.abs(dx)>
            Math.abs(dy)
        ){

            photo.style.transform=
                "translateX("+
                dx*.45+
                "px)";

        }

    },
    {passive:true}
);


photo.addEventListener(
    "touchend",
    function(){

        if(!dragging)return;


        dragging=false;


        const dx=
            lastX-startX;


        if(Math.abs(dx)<60){

            photo.style.transition=
                "transform .2s ease";


            photo.style.transform=
                "translateX(0)";


            return;

        }


        const direction=
            dx<0?-1:1;


        photo.style.transition=
            "transform .18s ease";


        photo.style.transform=
            "translateX("+
            direction*
            window.innerWidth+
            "px)";


        setTimeout(
            function(){

                if(direction<0){

                    nextPhoto();

                }else{

                    previousPhoto();

                }


                photo.style.transition=
                    "none";


                photo.style.transform=
                    "translateX("+
                    (-direction*
                    window.innerWidth)+
                    "px)";


                requestAnimationFrame(
                    function(){

                        requestAnimationFrame(
                            function(){

                                photo.style.transition=
                                    "transform .22s ease";


                                photo.style.transform=
                                    "translateX(0)";

                            }
                        );

                    }
                );

            },
            180
        );

    },
    {passive:true}
);


/* =========================================
   RESIZE
========================================= */

window.addEventListener(
    "resize",
    function(){

        fitPhotoToScreen();

    }
);


/* =========================================
   ЗАПУСК
========================================= */

showPhoto(0);

</script>

</body>
</html>
