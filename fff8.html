<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Другие детали тоже нужны, тут собраны самые характерные.</title>

<style>

*{box-sizing:border-box}

html,body{
margin:0;
padding:0;
background:#111;
color:#fff;
font-family:Arial,sans-serif
}

header{
position:sticky;
top:0;
z-index:10;
text-align:center;
padding:15px;
background:#181818
}

h1{
margin:0 0 5px;
font-size:21px
}

#counter{
color:#aaa;
font-size:17px
}

.top-controls{
display:flex;
align-items:center;
justify-content:center;
gap:12px
}

.top-controls button{
background:#303030;
color:#fff;
border:2px solid #00ff44;
border-radius:8px;
padding:8px 12px;
font-size:17px
}

.top-controls button:active{
transform:scale(.96)
}


/* ОСНОВНОЕ ФОТО */

.viewer{
padding:15px 10px 20px;
display:flex;
flex-direction:column;
align-items:center
}

#caption{
width:100%;
max-width:900px;
text-align:center;
font-size:22px;
line-height:1.5;
margin-bottom:15px;
padding:0 10px;
color:#eee
}

.photo-container{
width:100%;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden
}

#photo{
width:100%;
height:auto;
max-width:100%;
border-radius:5px;
display:block;
object-fit:contain;
user-select:none;
-webkit-user-drag:none;
will-change:transform
}


/* ПЛИТОЧНАЯ ГАЛЕРЕЯ */

.gallery{
width:100%;
padding:20px 10px 100px
}

.gallery-group{
margin-bottom:30px
}

.gallery-group-title{
font-size:22px;
font-weight:bold;
text-align:center;
margin-bottom:12px;
color:#eee
}

.gallery-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:8px
}

.gallery-item{
width:100%;
aspect-ratio:1/1;
object-fit:cover;
border-radius:5px;
cursor:pointer;
opacity:.75;
border:3px solid transparent;
transition:opacity .15s,border-color .15s
}

.gallery-item.active{
opacity:1;
border-color:#fff
}


/* НИЖНЯЯ ЛЕНТА */

.thumbs{
position:fixed;
bottom:0;
left:0;
right:0;
background:#181818;
display:flex;
gap:6px;
overflow-x:auto;
padding:7px;
z-index:20;
border:2px solid #00ff44
}

.thumbs img{
width:62px;
height:62px;
flex:0 0 62px;
object-fit:cover;
border-radius:5px;
opacity:.55;
cursor:pointer
}

.thumbs img.active{
opacity:1;
outline:2px solid white
}


/* FULLSCREEN */

#fullscreen{
position:fixed;
inset:0;
display:none;
align-items:center;
justify-content:center;
z-index:999999;
background:rgba(0,0,0,.82);
backdrop-filter:blur(3px);
-webkit-backdrop-filter:blur(3px);
overflow:hidden;
padding:0;
touch-action:none;
user-select:none;
-webkit-user-select:none;
cursor:pointer
}

#fullscreenPhoto{
position:absolute;
left:50%;
top:50%;
display:block;
max-width:100vw;
max-height:100vh;
width:auto;
height:auto;
object-fit:contain;
transform:translate(-50%,-50%);
user-select:none;
-webkit-user-drag:none;

/*
КРИТИЧЕСКИ ВАЖНО:
сама картинка не получает touch/click.
Все события принимает fullscreen.
*/
pointer-events:none;

will-change:transform
}

body.fullscreen-active{
overflow:hidden
}

body.fullscreen-active header,
body.fullscreen-active .viewer,
body.fullscreen-active .gallery,
body.fullscreen-active .thumbs{
pointer-events:none
}


@media(max-width:600px){

.gallery-grid{
grid-template-columns:repeat(4,1fr);
gap:5px
}

.gallery-item{
border-width:2px
}

}

</style>
</head>


<body>


<header>

<h1>
Другие детали тоже нужны, тут собраны самые характерные.
</h1>

<div class="top-controls">

<button onclick="previousPhoto()">
← Назад
</button>

<div id="counter">
Фото 1 из 80
</div>

<button onclick="nextPhoto()">
Вперёд →
</button>

</div>

</header>


<div class="viewer">

<div id="caption"></div>

<div class="photo-container">

<img
id="photo"
src=""
alt="Фото 1"
>

</div>

</div>


<div
class="gallery"
id="gallery">
</div>


<div
class="thumbs"
id="thumbs">
</div>


<!-- FULLSCREEN -->

<div id="fullscreen">

<img
id="fullscreenPhoto"
src=""
alt=""
>

</div>


<script>


/* =========================================
   НАСТРОЙКИ
========================================= */

const TOTAL_PHOTOS=80;


/* =========================================
   ДОПОЛНИТЕЛЬНЫЕ ФОТО
========================================= */

const extraPhotos={

68:["a","b"]

};


/* =========================================
   ПОДПИСИ
========================================= */

const captions={

1:"Турели",

6:"Крюк буксировочный",

10:"Танковая фара и маскировочные фонари",

24:"Ведущее колесо",

27:"Ленивец гусеничной техники, 50 см",

31:"Диск автомобиля",

35:"Пехотная тележка",

39:"Крепления инструмента и оружия",

43:"Крепления мотоциклетных ящиков",

48:"баки мотоциклов",

52:"Бронещит",

56:"Ящик мотоцикла",

61:"Характерные немецкие болты",

63:"Ленивцы танков",

65:"Колесо пехотные тележки",

66:"Траки полугусеничных машин и танков",

72:"Люк с красной грунтовкой",

73:"Вентиляционная решетка танка",

74:"Балансиры гусеничных машин",

78:"Поворотные кулаки",

79:"Петля люка",

80:"опорный каток"

};


/* =========================================
   СПИСОК ФАЙЛОВ
========================================= */

const photoFiles=[];

for(
let i=1;
i<=TOTAL_PHOTOS;
i++
){

const n=
String(i).padStart(3,"0");

photoFiles.push(
n+".jpg"
);

if(extraPhotos[i]){

extraPhotos[i].forEach(
letter=>{

photoFiles.push(
n+letter+".jpg"
);

});

}

}


/* =========================================
   ПОДПИСЬ
========================================= */

function getCaption(index){

const match=
photoFiles[index]
.match(/^(\d{3})/);

if(!match)return"";

const n=
Number(match[1]);

let result="";

for(
const start in captions
){

if(
Number(start)<=n
){

result=
captions[start];

}

}

return result;

}


/* =========================================
   ОБЪЕКТЫ
========================================= */

const photos=
photoFiles.map(
(file,index)=>({

file:
"photos/"+file,

filename:
file,

number:
index+1,

caption:
getCaption(index)

})
);


/* =========================================
   ПЕРЕМЕННЫЕ
========================================= */

let current=0;

let fullscreenOpen=false;

let fullscreenIndex=0;

let fsStartX=0;

let fsStartY=0;

let fsMoved=false;


/*
Этот флаг используется ТОЛЬКО
для click, который Android может
создать непосредственно после СВАЙПА.

При обычном открытии/закрытии
он НЕ устанавливается.
*/

let suppressSyntheticClick=false;


const photo=
document.getElementById("photo");

const caption=
document.getElementById("caption");

const counter=
document.getElementById("counter");

const thumbs=
document.getElementById("thumbs");

const gallery=
document.getElementById("gallery");

const fullscreen=
document.getElementById("fullscreen");

const fullscreenPhoto=
document.getElementById("fullscreenPhoto");


/* =========================================
   ПЛИТОЧНАЯ ГАЛЕРЕЯ
========================================= */

let group=null;

photos.forEach(
(item,index)=>{

if(
!group ||
group.caption!==item.caption
){

group={

caption:item.caption,

container:
document.createElement("div"),

grid:
document.createElement("div")

};

group.container.className=
"gallery-group";

const title=
document.createElement("div");

title.className=
"gallery-group-title";

title.textContent=
item.caption;

group.grid.className=
"gallery-grid";

group.container.appendChild(
title
);

group.container.appendChild(
group.grid
);

gallery.appendChild(
group.container
);

}


const img=
document.createElement("img");

img.src=
item.file;

img.loading=
"lazy";

img.className=
"gallery-item";

img.alt=
item.caption;

img.dataset.index=
index;


/*
Плиточная галерея открывает fullscreen.
*/

img.addEventListener(
"click",
function(e){

e.preventDefault();

e.stopPropagation();

showPhoto(index);

openFullscreen(index);

},
false
);

group.grid.appendChild(img);

});


/* =========================================
   НИЖНЯЯ ЛЕНТА
========================================= */

photos.forEach(
(item,index)=>{

const img=
document.createElement("img");

img.src=
item.file;

img.loading=
"lazy";


/*
Нижняя лента fullscreen
НЕ открывает.
*/

img.addEventListener(
"click",
function(e){

e.preventDefault();

e.stopPropagation();

showPhoto(index);

},
false
);

thumbs.appendChild(img);

});


/* =========================================
   ПОДГОНКА ОСНОВНОГО ФОТО
========================================= */

function fitPhotoToScreen(){

const headerHeight=
document
.querySelector("header")
.offsetHeight;

const captionHeight=
caption.offsetHeight;

const available=
window.innerHeight-
headerHeight-
captionHeight-
55;

if(
!photo.naturalWidth ||
!photo.naturalHeight
)return;

const w=
photo.parentElement.clientWidth;

const h=
w*
photo.naturalHeight/
photo.naturalWidth;

if(h>available){

photo.style.width="auto";

photo.style.height=
available+"px";

}else{

photo.style.width="100%";

photo.style.height="auto";

}

photo.style.maxWidth="100%";

}


/* =========================================
   ПОКАЗ ФОТО
========================================= */

function showPhoto(index){

if(index<0){

index=
photos.length-1;

}

if(index>=photos.length){

index=0;

}

current=index;

const item=
photos[current];

photo.src=
item.file;

photo.alt=
item.caption;

caption.textContent=
item.caption;

counter.textContent=
"Фото "+
(current+1)+
" из "+
photos.length;

photo.onload=
function(){

fitPhotoToScreen();

};


/* Нижняя лента */

document
.querySelectorAll(".thumbs img")
.forEach(
(img,i)=>{

img.classList.toggle(
"active",
i===current
);

});


const activeThumb=
thumbs.children[current];

if(activeThumb){

activeThumb.scrollIntoView({

behavior:"smooth",

inline:"center",

block:"nearest"

});

}


/* Плиточная галерея */

document
.querySelectorAll(".gallery-item")
.forEach(
(img,i)=>{

img.classList.toggle(
"active",
i===current
);

});

}


/* =========================================
   ОБЫЧНАЯ НАВИГАЦИЯ
========================================= */

function nextPhoto(){

showPhoto(
current+1
);

}

function previousPhoto(){

showPhoto(
current-1
);

}


/* =========================================
   ОТКРЫТЬ FULLSCREEN
========================================= */

function openFullscreen(index){

fullscreenIndex=index;

fullscreenOpen=true;


/*
При открытии никакой блокировки click
не устанавливаем.
*/

suppressSyntheticClick=false;

document.body
.classList.add(
"fullscreen-active"
);

fullscreenPhoto.src=
photos[index].file;

fullscreenPhoto.style.transition=
"none";

fullscreenPhoto.style.transform=
"translate(-50%,-50%)";

fullscreen.style.display="flex";

document.body.style.overflow="hidden";

}


/* =========================================
   ЗАКРЫТЬ FULLSCREEN
========================================= */

function closeFullscreen(){

fullscreenOpen=false;

fullscreen.style.display="none";

fullscreenPhoto.src="";

fullscreenPhoto.style.transition="none";

fullscreenPhoto.style.transform=
"translate(-50%,-50%)";

document.body
.classList.remove(
"fullscreen-active"
);

document.body.style.overflow="";

}


/* =========================================
   FULLSCREEN TOUCHSTART
========================================= */

fullscreen.addEventListener(
"touchstart",
function(e){

if(!fullscreenOpen)
return;

e.preventDefault();

e.stopPropagation();

fsStartX=
e.changedTouches[0].clientX;

fsStartY=
e.changedTouches[0].clientY;

fsMoved=false;

},
{
passive:false
}
);


/* =========================================
   FULLSCREEN TOUCHMOVE
========================================= */

fullscreen.addEventListener(
"touchmove",
function(e){

if(!fullscreenOpen)
return;

e.preventDefault();

e.stopPropagation();

const dx=
e.changedTouches[0].clientX-
fsStartX;

const dy=
e.changedTouches[0].clientY-
fsStartY;

if(
Math.abs(dx)>8 &&
Math.abs(dx)>Math.abs(dy)
){

fsMoved=true;

fullscreenPhoto.style.transition=
"none";

fullscreenPhoto.style.transform=
"translate(calc(-50% + "+
dx+
"px),-50%)";

}

},
{
passive:false
}
);


/* =========================================
   FULLSCREEN TOUCHEND
========================================= */

fullscreen.addEventListener(
"touchend",
function(e){

if(!fullscreenOpen)
return;

e.preventDefault();

e.stopPropagation();

const dx=
e.changedTouches[0].clientX-
fsStartX;


/*
-----------------------------------------
ОБЫЧНЫЙ ТАП
-----------------------------------------

Закрываем fullscreen.

ВАЖНО:
suppressSyntheticClick НЕ ставим.

Поэтому следующий обычный тап
по основной странице работает
с первого раза.
*/

if(!fsMoved){

closeFullscreen();

return;

}


/*
-----------------------------------------
СВАЙП
-----------------------------------------

Только после свайпа блокируем
возможный синтетический click.
*/

suppressSyntheticClick=true;


/*
Если свайп достаточно длинный —
переключаем фотографию.
*/

if(Math.abs(dx)>60){

if(dx<0){

fullscreenNavigate(1);

}else{

fullscreenNavigate(-1);

}

}else{

fullscreenPhoto.style.transition=
"transform .15s ease";

fullscreenPhoto.style.transform=
"translate(-50%,-50%)";

}


/*
Снимаем блокировку через небольшой
интервал. Этого достаточно, чтобы
поглотить synthetic click от Android.
*/

setTimeout(
function(){

suppressSyntheticClick=false;

},
350
);

fsMoved=false;

},
{
passive:false
}
);


/* =========================================
   FULLSCREEN CLICK
========================================= */

fullscreen.addEventListener(
"click",
function(e){

/*
Если это synthetic click,
созданный после свайпа —
ничего не делаем.

Он не должен попасть
в нижнюю галерею.
*/

if(suppressSyntheticClick){

e.preventDefault();

e.stopPropagation();

return;

}


/*
Любой обычный click
в fullscreen закрывает его.
*/

if(fullscreenOpen){

e.preventDefault();

e.stopPropagation();

closeFullscreen();

}

},
true
);


/* =========================================
   ДОПОЛНИТЕЛЬНАЯ ЗАЩИТА ОТ CLICK
========================================= */

document.addEventListener(
"click",
function(e){

if(
fullscreenOpen &&
suppressSyntheticClick
){

e.preventDefault();

e.stopImmediatePropagation();

}

},
true
);


/* =========================================
   FULLSCREEN СВАЙП
========================================= */

function fullscreenNavigate(direction){

let index=
fullscreenIndex+
direction;

if(index<0){

index=
photos.length-1;

}

if(index>=photos.length){

index=0;

}


const outX=
direction>0
?
-window.innerWidth
:
window.innerWidth;


/*
Уезжающая фотография.
*/

fullscreenPhoto.style.transition=
"transform .18s ease";

fullscreenPhoto.style.transform=
"translate(calc(-50% + "+
outX+
"px),-50%)";


setTimeout(
function(){

fullscreenIndex=index;

current=index;

showPhoto(index);


/*
Новая фотография появляется
с противоположной стороны.
*/

const inX=
direction>0
?
window.innerWidth
:
-window.innerWidth;

fullscreenPhoto.style.transition=
"none";

fullscreenPhoto.style.transform=
"translate(calc(-50% + "+
inX+
"px),-50%)";

fullscreenPhoto.src=
photos[index].file;


requestAnimationFrame(
function(){

requestAnimationFrame(
function(){

fullscreenPhoto.style.transition=
"transform .18s ease";

fullscreenPhoto.style.transform=
"translate(-50%,-50%)";

});

});

},
180
);

}


/* =========================================
   ТАП ПО ОСНОВНОЙ ФОТОГРАФИИ
========================================= */

photo.addEventListener(
"click",
function(e){

if(fullscreenOpen)
return;

e.preventDefault();

e.stopPropagation();

openFullscreen(current);

},
false
);


/* =========================================
   СВАЙП ОСНОВНОЙ ФОТОГРАФИИ
========================================= */

let mainStartX=0;

let mainStartY=0;

let mainMoved=false;


photo.addEventListener(
"touchstart",
function(e){

if(fullscreenOpen)
return;

mainStartX=
e.changedTouches[0].clientX;

mainStartY=
e.changedTouches[0].clientY;

mainMoved=false;

},
{
passive:true
}
);


photo.addEventListener(
"touchmove",
function(e){

if(fullscreenOpen)
return;

const dx=
e.changedTouches[0].clientX-
mainStartX;

const dy=
e.changedTouches[0].clientY-
mainStartY;

if(
Math.abs(dx)>10 &&
Math.abs(dx)>Math.abs(dy)
){

mainMoved=true;

e.preventDefault();

photo.style.transform=
"translateX("+
(dx*.25)+
"px)";

}

},
{
passive:false
}
);


photo.addEventListener(
"touchend",
function(e){

if(fullscreenOpen)
return;

if(!mainMoved)
return;

const dx=
e.changedTouches[0].clientX-
mainStartX;

photo.style.transition=
"transform .16s ease";

if(Math.abs(dx)>60){

photo.style.transform=
"translateX("+
(
dx<0
?
-window.innerWidth*.25
:
window.innerWidth*.25
)+
"px)";

setTimeout(
function(){

photo.style.transition="none";

showPhoto(
current+
(dx<0?1:-1)
);

photo.style.transform=
"translateX(0)";

},
160
);

}else{

photo.style.transform=
"translateX(0)";

}

setTimeout(
function(){

photo.style.transition="none";

},
160
);

mainMoved=false;

},
{
passive:true
}
);


/* =========================================
   КЛАВИАТУРА
========================================= */

document.addEventListener(
"keydown",
function(e){

if(fullscreenOpen){

if(e.key==="Escape"){

e.preventDefault();

closeFullscreen();

return;

}

if(e.key==="ArrowRight"){

e.preventDefault();

fullscreenNavigate(1);

return;

}

if(e.key==="ArrowLeft"){

e.preventDefault();

fullscreenNavigate(-1);

return;

}

return;

}


if(e.key==="ArrowRight"){

nextPhoto();

}

if(e.key==="ArrowLeft"){

previousPhoto();

}

});


/* =========================================
   СИСТЕМНАЯ КНОПКА НАЗАД
========================================= */

history.pushState(
{album:true},
"",
location.href
);

window.addEventListener(
"popstate",
function(){

if(fullscreenOpen){

closeFullscreen();

history.pushState(
{album:true},
"",
location.href
);

}else{

history.back();

}

});


/* =========================================
   RESIZE
========================================= */

window.addEventListener(
"resize",
function(){

if(!fullscreenOpen){

fitPhotoToScreen();

}

});


/* =========================================
   ЗАПУСК
========================================= */

showPhoto(0);

</script>

</body>
  </html>
