<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Другие детали тоже нужны, тут собраны самые характерные.</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    text-align: center;
    padding: 15px;
    background: #181818;
    position: sticky;
    top: 0;
    z-index: 10;
}

h1 {
    margin: 0 0 5px;
    font-size: 21px;
}

#counter {
    color: #aaa;
    font-size: 14px;
}

.top-controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
}

.top-controls button {
    background: #303030;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 14px;
}

.top-controls button:active {
    transform: scale(.96);
}


/* ==================================================
   ОСНОВНАЯ ОБЛАСТЬ
================================================== */

.viewer {

    padding:
        15px
        10px
        20px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: flex-start;
}


/* ==================================================
   ОПИСАНИЕ
================================================== */

#caption {

    width: 100%;

    max-width: 900px;

    text-align: center;

    font-size: 18px;

    line-height: 1.5;

    margin-bottom: 15px;

    padding: 0 10px;

    color: #eee;
}


/* ==================================================
   КОНТЕЙНЕР ОСНОВНОЙ ФОТОГРАФИИ
================================================== */

.photo-container {

    width: 100%;

    display: flex;

    justify-content: center;

    align-items: center;
}


/* ==================================================
   ОСНОВНАЯ ФОТОГРАФИЯ
================================================== */

#photo {

    width: 100%;

    height: auto;

    max-width: 100%;

    border-radius: 5px;

    user-select: none;

    -webkit-user-drag: none;

    display: block;

    object-fit: contain;

    transition:
        width .2s ease,
        height .2s ease;
}


/* ==================================================
   БОЛЬШАЯ ГАЛЕРЕЯ
================================================== */

.gallery {

    width: 100%;

    padding:
        20px
        10px
        100px;
}

.gallery-group {

    margin-bottom: 30px;
}

.gallery-group-title {

    font-size: 18px;

    font-weight: bold;

    text-align: center;

    margin-bottom: 12px;

    color: #eee;
}

.gallery-grid {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 8px;
}

.gallery-item {

    width: 100%;

    aspect-ratio: 1 / 1;

    object-fit: cover;

    border-radius: 5px;

    cursor: pointer;

    opacity: .75;

    border: 3px solid transparent;

    transition:
        opacity .15s,
        border-color .15s,
        transform .15s;
}

.gallery-item:hover {

    opacity: 1;
}

.gallery-item.active {

    opacity: 1;

    border: 3px solid white;
}


/* ==================================================
   НИЖНЯЯ ФИКСИРОВАННАЯ ЛЕНТА
================================================== */

.thumbs {

    position: fixed;

    bottom: 0;

    left: 0;

    right: 0;

    background: #181818;

    display: flex;

    gap: 6px;

    overflow-x: auto;

    padding: 7px;

    z-index: 20;
}

.thumbs img {

    width: 62px;

    height: 62px;

    flex: 0 0 62px;

    object-fit: cover;

    border-radius: 5px;

    opacity: .55;
}

.thumbs img.active {

    opacity: 1;

    outline: 2px solid white;
}


/* ==================================================
   МОБИЛЬНЫЙ ЭКРАН
================================================== */

@media (max-width: 600px) {

    .gallery-grid {

        grid-template-columns:
            repeat(4, 1fr);

        gap: 5px;
    }

    .gallery-item {

        border-width: 2px;
    }

}

</style>

</head>


<body>


<header>

<h1>Другие детали тоже нужны, тут собраны самые характерные.</h1>


<div class="top-controls">

<button onclick="previousPhoto()">
← Назад
</button>


<div id="counter">
Фото 1 из 80
</div>


<button onclick="nextPhoto()">
Вперёд →
</button>

</div>

</header>



<!-- ==================================================
     ОСНОВНАЯ ФОТОГРАФИЯ
================================================== -->

<div class="viewer">


<div id="caption">
</div>


<div class="photo-container">

<img
    id="photo"
    src=""
    alt="Фото 1"
>

</div>


</div>



<!-- ==================================================
     БОЛЬШАЯ ГАЛЕРЕЯ
================================================== -->

<div
    class="gallery"
    id="gallery">
</div>



<!-- ==================================================
     НИЖНЯЯ ФИКСИРОВАННАЯ ЛЕНТА
================================================== -->

<div
    class="thumbs"
    id="thumbs">
</div>



<script>


/*
====================================================
ОСНОВНЫЕ НАСТРОЙКИ
====================================================
*/


/*
Количество обычных фотографий.

001.jpg
002.jpg
003.jpg
...
080.jpg
*/

const TOTAL_PHOTOS = 80;



/*
====================================================
ДОПОЛНИТЕЛЬНЫЕ ФОТОГРАФИИ
====================================================

Здесь указываются ТОЛЬКО дополнительные фотографии
с буквами.

Например:

25: ["A", "B"]

создаст:

025.jpg
025A.jpg
025B.jpg
026.jpg


Другой пример:

57: ["A", "B", "C"]

создаст:

057.jpg
057A.jpg
057B.jpg
057C.jpg
058.jpg


Если дополнительных фотографий между 30 и 31 нет,
ничего писать не нужно.
====================================================
*/


const extraPhotos = {
    68: ["a", "b"]

    /*
    25: ["A", "B", "C"],

    40: ["A"],

    57: ["A", "B"],

    70: ["A", "B", "C"]
    */

};


/*
====================================================
НАСТРОЙКА ПОДПИСЕЙ
====================================================

Описание начинает действовать с указанного
обычного номера фотографии и продолжается
до следующего описания.

Например:

024 = Ведущее колесо

Значит:

024.jpg
025.jpg
025A.jpg
025B.jpg
026.jpg

получат описание:

"Ведущее колесо"

А с 027 начинается следующая группа.
====================================================
*/


const captions = {

    1: "Турели",

    6: "Крюк буксировочный",

    10: "Танковая фара и маскировочные фонари",

    24: "Ведущее колесо",

    27: "Ленивец гусеничной техники, 50 см",

    31: "Диск автомобиля",

    35: "Пехотная тележка",

    39: "Крепления инструмента и оружия",

    43: "Крепления мотоциклетных ящиков",

    48: "баки мотоциклов",

    52: "Бронещит",

    56: "Ящик мотоцикла",

    61: "Характерные немецкие болты",

    63: "Ленивцы танков",

    65: "Колесо пехотные тележки",

    66: "Траки полугусеничных машин и танков",

    72: "Люк с красной грунтовкой",

    73: "Вентиляционная решетка танка",

    74: "Балансиры гусеничных машин",

    78: "Поворотные кулаки",

    79: "Петля люка",

    80: "опорный каток"

};


/*
====================================================
СОЗДАНИЕ СПИСКА ФОТОГРАФИЙ
====================================================

Здесь НИЧЕГО вручную писать не нужно.

Код сам создаёт:

001.jpg
002.jpg
...
080.jpg

и автоматически вставляет дополнительные:

025A.jpg
025B.jpg
и т.д.
====================================================
*/


const photoFiles = [];


for (
    let i = 1;
    i <= TOTAL_PHOTOS;
    i++
) {


    /*
    Обычная фотография
    */

    const number =
        String(i).padStart(3, "0");


    photoFiles.push(
        number + ".jpg"
    );


    /*
    Дополнительные фотографии
    */

    if (
        extraPhotos[i]
    ) {


        extraPhotos[i].forEach(
            letter => {

                photoFiles.push(

                    number +
                    letter +
                    ".jpg"

                );

            }
        );

    }

}


/*
====================================================
ПОЛУЧЕНИЕ ОПИСАНИЯ
====================================================
*/


function getCaption(photoIndex) {

    let currentCaption = "";


    /*
    Находим обычный номер фотографии,
    которому соответствует текущий файл.

    Например:

    025.jpg  → 25
    025A.jpg → 25
    025B.jpg → 25
    */

    const filename =
        photoFiles[photoIndex];


    const match =
        filename.match(/^(\d{3})/);


    if (!match) {

        return "";

    }


    const baseNumber =
        Number(match[1]);


    /*
    Ищем ближайшее предыдущее описание.
    */

    for (
        const start in captions
    ) {

        const startNumber =
            Number(start);


        if (
            startNumber <= baseNumber
        ) {

            currentCaption =
                captions[start];

        }

    }


    return currentCaption;

}


/*
====================================================
СОЗДАНИЕ ОБЪЕКТОВ ФОТОГРАФИЙ
====================================================
*/


const photos = [];


photoFiles.forEach(
    (file, index) => {


        photos.push({

            file:
                "photos/" + file,

            filename:
                file,

            number:
                index + 1,

            caption:
                getCaption(index)

        });

    }
);


/*
====================================================
ЭЛЕМЕНТЫ СТРАНИЦЫ
====================================================
*/


let current = 0;


const photo =
    document.getElementById("photo");


const caption =
    document.getElementById("caption");


const counter =
    document.getElementById("counter");


const thumbs =
    document.getElementById("thumbs");


const gallery =
    document.getElementById("gallery");


/*
====================================================
СОЗДАНИЕ БОЛЬШОЙ ГАЛЕРЕИ
====================================================
*/


let currentGroup = null;


photos.forEach(
    (item, index) => {


        /*
        Если описание изменилось,
        начинаем новую строку/группу.
        */

        if (
            currentGroup === null ||
            currentGroup.caption !== item.caption
        ) {


            currentGroup = {

                caption:
                    item.caption,

                container:
                    document.createElement("div"),

                grid:
                    document.createElement("div")

            };


            currentGroup.container
                .className =
                "gallery-group";


            const title =
                document.createElement("div");


            title.className =
                "gallery-group-title";


            title.textContent =
                item.caption;


            currentGroup.grid
                .className =
                "gallery-grid";


            currentGroup.container
                .appendChild(title);


            currentGroup.container
                .appendChild(
                    currentGroup.grid
                );


            gallery.appendChild(
                currentGroup.container
            );

        }


        /*
        Создаём фотографию
        */

        const img =
            document.createElement("img");


        img.src =
            item.file;


        img.loading =
            "lazy";


        img.className =
            "gallery-item";


        img.alt =
            item.caption;


        img.dataset.index =
            index;


        img.onclick =
            function() {

                showPhoto(index);

            };


        currentGroup.grid
            .appendChild(img);

    }
);


/*
====================================================
СОЗДАНИЕ НИЖНЕЙ ЛЕНТЫ
====================================================
*/


photos.forEach(
    (item, index) => {


        const img =
            document.createElement("img");


        img.src =
            item.file;


        img.loading =
            "lazy";


        img.onclick =
            function() {

                showPhoto(index);

            };


        thumbs.appendChild(img);

    }
);


/*
====================================================
ПОДГОНКА ОСНОВНОЙ ФОТОГРАФИИ
====================================================

Обычная фотография:
→ 100% ширины.

Очень высокая фотография:
→ уменьшается так, чтобы полностью
   помещаться в доступной области экрана.
====================================================
*/


function fitPhotoToScreen() {


    const screenHeight =
        window.innerHeight;


    const headerHeight =
        document.querySelector("header")
        .offsetHeight;


    const captionHeight =
        caption.offsetHeight;


    /*
    Доступная высота.

    Оставляем небольшой запас,
    чтобы фотография не упиралась
    в элементы интерфейса.
    */

    const availableHeight =
        screenHeight -
        headerHeight -
        captionHeight -
        55;


    /*
    Сбрасываем предыдущие размеры.
    */

    photo.style.maxHeight =
        "none";


    photo.style.width =
        "100%";


    photo.style.height =
        "auto";


    const naturalWidth =
        photo.naturalWidth;


    const naturalHeight =
        photo.naturalHeight;


    if (
        !naturalWidth ||
        !naturalHeight
    ) {

        return;

    }


    const availableWidth =
        photo.parentElement
            .clientWidth;


    /*
    Рассчитываем высоту,
    которую фотография имела бы
    при ширине 100%.
    */

    const naturalDisplayHeight =
        availableWidth *
        naturalHeight /
        naturalWidth;


    /*
    Если фотография слишком высокая,
    уменьшаем её по высоте.
    */

    if (
        naturalDisplayHeight >
        availableHeight
    ) {

        photo.style.width =
            "auto";


        photo.style.height =
            availableHeight + "px";


        photo.style.maxWidth =
            "100%";


        photo.style.objectFit =
            "contain";

    }

    else {

        /*
        Обычная фотография —
        снова полная ширина.
        */

        photo.style.width =
            "100%";


        photo.style.height =
            "auto";

    }

}


/*
====================================================
ПОКАЗАТЬ ФОТОГРАФИЮ
====================================================
*/


function showPhoto(index) {


    /*
    Переход с первой фотографии
    на последнюю.
    */

    if (index < 0) {

        index =
            photos.length - 1;

    }


    /*
    Переход с последней
    на первую.
    */

    if (
        index >= photos.length
    ) {

        index = 0;

    }


    current = index;


    const item =
        photos[current];


    /*
    Основная фотография
    */

    photo.src =
        item.file;


    photo.alt =
        item.caption;


    /*
    Описание
    */

    caption.textContent =
        item.caption;


    /*
    Счётчик
    */

    counter.textContent =
        "Фото " +
        (current + 1) +
        " из " +
        photos.length;


    /*
    После загрузки фотографии
    рассчитываем её размер.
    */

    photo.onload =
        function() {

            fitPhotoToScreen();

        };


    /*
    ==================================================
    АКТИВНАЯ МИНИАТЮРА
    ==================================================
    */

    document
        .querySelectorAll(".thumbs img")
        .forEach(
            (img, i) => {

                img.classList.toggle(

                    "active",

                    i === current

                );

            }
        );


    /*
    ==================================================
    ПРОКРУТКА НИЖНЕЙ ЛЕНТЫ
    ==================================================
    */

    const activeThumb =
        thumbs.children[current];


    if (activeThumb) {

        activeThumb.scrollIntoView({

            behavior: "smooth",

            inline: "center",

            block: "nearest"

        });

    }


    /*
    ==================================================
    АКТИВНАЯ ФОТОГРАФИЯ
    В БОЛЬШОЙ ГАЛЕРЕЕ
    ==================================================
    */

    document
        .querySelectorAll(".gallery-item")
        .forEach(
            (img, i) => {

                img.classList.toggle(

                    "active",

                    i === current

                );

            }
        );

}


/*
====================================================
ИЗМЕНЕНИЕ РАЗМЕРА ЭКРАНА
====================================================
*/


window.addEventListener(

    "resize",

    function() {

        fitPhotoToScreen();

    }

);


/*
====================================================
СЛЕДУЮЩАЯ ФОТОГРАФИЯ
====================================================
*/


function nextPhoto() {

    showPhoto(
        current + 1
    );

}


/*
====================================================
ПРЕДЫДУЩАЯ ФОТОГРАФИЯ
====================================================
*/


function previousPhoto() {

    showPhoto(
        current - 1
    );

}


/*
====================================================
КЛАВИАТУРА
====================================================
*/


document.addEventListener(

    "keydown",

    function(event) {


        if (
            event.key ===
            "ArrowRight"
        ) {

            nextPhoto();

        }


        if (
            event.key ===
            "ArrowLeft"
        ) {

            previousPhoto();

        }

    }

);


/*
====================================================
ЛИСТАНИЕ ПАЛЬЦЕМ
====================================================
*/


let startX = 0;

let startY = 0;


photo.addEventListener(

    "touchstart",

    function(event) {


        startX =
            event.changedTouches[0]
            .screenX;


        startY =
            event.changedTouches[0]
            .screenY;

    },

    {
        passive: true
    }

);


photo.addEventListener(

    "touchend",

    function(event) {


        const endX =
            event.changedTouches[0]
            .screenX;


        const endY =
            event.changedTouches[0]
            .screenY;


        const differenceX =
            endX - startX;


        const differenceY =
            endY - startY;


        if (

            Math.abs(differenceX) > 60 &&

            Math.abs(differenceX) >
            Math.abs(differenceY)

        ) {


            if (
                differenceX < 0
            ) {

                nextPhoto();

            }

            else {

                previousPhoto();

            }

        }

    },

    {
        passive: true
    }

);


/*
====================================================
ЗАПУСК
====================================================
*/


showPhoto(0);


</script>


</body>
    </html>
