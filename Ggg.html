<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Другие детали тоже нужны, тут собраны самые характерные.</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    text-align: center;
    padding: 15px;
    background: #181818;
    position: sticky;
    top: 0;
    z-index: 10;
}

h1 {
    margin: 0 0 5px;
    font-size: 21px;
}

#counter {
    color: #aaa;
    font-size: 14px;
}

.top-controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
}

.top-controls button {
    background: #303030;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 14px;
}

.top-controls button:active {
    transform: scale(.96);
}


/* ==================================================
   ОСНОВНАЯ ФОТОГРАФИЯ
================================================== */

.viewer {

    padding:
        15px
        10px
        20px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: flex-start;
}

#caption {

    width: 100%;

    max-width: 900px;

    text-align: center;

    font-size: 18px;

    line-height: 1.5;

    margin-bottom: 15px;

    padding: 0 10px;

    color: #eee;
}

#photo {

    width: 100%;

    height: auto;

    max-width: 100%;

    border-radius: 5px;

    user-select: none;

    -webkit-user-drag: none;
}


/* ==================================================
   БОЛЬШАЯ ГАЛЕРЕЯ
================================================== */

.gallery {

    width: 100%;

    padding:
        20px
        10px
        100px;
}

.gallery-group {

    margin-bottom: 30px;
}

.gallery-group-title {

    font-size: 18px;

    font-weight: bold;

    text-align: center;

    margin-bottom: 12px;

    color: #eee;
}

.gallery-grid {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 8px;
}

.gallery-item {

    width: 100%;

    aspect-ratio: 1 / 1;

    object-fit: cover;

    border-radius: 5px;

    cursor: pointer;

    opacity: .75;

    border: 3px solid transparent;

    transition:
        opacity .15s,
        border-color .15s,
        transform .15s;
}

.gallery-item:hover {

    opacity: 1;
}

.gallery-item.active {

    opacity: 1;

    border: 3px solid white;
}


/* ==================================================
   НИЖНЯЯ ФИКСИРОВАННАЯ ЛЕНТА
================================================== */

.thumbs {

    position: fixed;

    bottom: 0;

    left: 0;

    right: 0;

    background: #181818;

    display: flex;

    gap: 6px;

    overflow-x: auto;

    padding: 7px;

    z-index: 20;
}

.thumbs img {

    width: 62px;

    height: 62px;

    flex: 0 0 62px;

    object-fit: cover;

    border-radius: 5px;

    opacity: .55;
}

.thumbs img.active {

    opacity: 1;

    outline: 2px solid white;
}


/* ==================================================
   МОБИЛЬНЫЙ ЭКРАН
================================================== */

@media (max-width: 600px) {

    .gallery-grid {

        grid-template-columns:
            repeat(4, 1fr);

        gap: 5px;
    }

    .gallery-item {

        border-width: 2px;
    }

}

</style>

</head>


<body>


<header>

<h1>Другие детали тоже нужны, тут собраны самые характерные.</h1>


<div class="top-controls">

<button onclick="previousPhoto()">
← Назад
</button>


<div id="counter">
Фото 1 из 80
</div>


<button onclick="nextPhoto()">
Вперёд →
</button>

</div>


</header>



<!-- ==================================================
     ОСНОВНАЯ ФОТОГРАФИЯ
================================================== -->

<div class="viewer">


<div id="caption">
</div>


<img
    id="photo"
    src=""
    alt="Фото 1"
>


</div>



<!-- ==================================================
     БОЛЬШАЯ ГАЛЕРЕЯ
================================================== -->

<div
    class="gallery"
    id="gallery">
</div>



<!-- ==================================================
     НИЖНЯЯ ФИКСИРОВАННАЯ ЛЕНТА
================================================== -->

<div
    class="thumbs"
    id="thumbs">
</div>



<script>


/*
====================================================
СПИСОК ФОТОГРАФИЙ
====================================================

ЗДЕСЬ ТЕПЕРЬ ДОБАВЛЯЮТСЯ ФОТОГРАФИИ.

Чтобы вставить фотографию между 025 и 026:

"025.jpg",
"025A.jpg",
"026.jpg"

Чтобы добавить ещё:

"025A.jpg",
"025B.jpg",
"025C.jpg"

Порядок здесь = порядок фотографий в альбоме.
====================================================
*/

const photoFiles = [

    "001.jpg",
    "002.jpg",
    "003.jpg",
    "004.jpg",
    "005.jpg",

    "006.jpg",
    "007.jpg",
    "008.jpg",
    "009.jpg",

    "010.jpg",
    "011.jpg",
    "012.jpg",
    "013.jpg",
    "014.jpg",
    "015.jpg",
    "016.jpg",
    "017.jpg",
    "018.jpg",
    "019.jpg",
    "020.jpg",
    "021.jpg",
    "022.jpg",
    "023.jpg",

    "024.jpg",
    "025.jpg",

    /* 
       ПРИМЕР ДОБАВЛЕНИЯ:

       "025A.jpg",
       "025B.jpg",

    */

    "026.jpg",
    "027.jpg",
    "028.jpg",
    "029.jpg",
    "030.jpg",

    "031.jpg",
    "032.jpg",
    "033.jpg",
    "034.jpg",

    "035.jpg",
    "036.jpg",
    "037.jpg",
    "038.jpg",

    "039.jpg",
    "040.jpg",
    "041.jpg",
    "042.jpg",

    "043.jpg",
    "044.jpg",
    "045.jpg",
    "046.jpg",
    "047.jpg",

    "048.jpg",
    "049.jpg",
    "050.jpg",
    "051.jpg",

    "052.jpg",
    "053.jpg",
    "054.jpg",
    "055.jpg",

    "056.jpg",
    "057.jpg",
    "058.jpg",
    "059.jpg",
    "060.jpg",

    "061.jpg",
    "062.jpg",

    "063.jpg",
    "064.jpg",

    "065.jpg",

    "066.jpg",
    "067.jpg",
    "068.jpg",
    "069.jpg",
    "070.jpg",
    "071.jpg",

    "072.jpg",

    "073.jpg",

    "074.jpg",
    "075.jpg",
    "076.jpg",
    "077.jpg",

    "078.jpg",

    "079.jpg",

    "080.jpg"

];


/*
====================================================
НАЧАЛО ГРУПП С ОПИСАНИЯМИ
====================================================

Здесь теперь указываются ИМЕНА ФАЙЛОВ,
а не номера фотографий.

Например:

"001.jpg" = Турели

Значит все фотографии после 001.jpg
до следующего указанного файла
получат описание "Турели".

Если добавить 025A.jpg между 025.jpg и 026.jpg,
она автоматически получит описание
"Ведущее колесо".
====================================================
*/

const captions = {

    "001.jpg": "Турели",

    "006.jpg": "Крюк буксировочный",

    "010.jpg": "Танковая фара и маскировочные фонари",

    "024.jpg": "Ведущее колесо",

    "027.jpg": "Ленивец гусеничной техники, 50 см",

    "031.jpg": "Диск автомобиля",

    "035.jpg": "Пехотная тележка",

    "039.jpg": "Крепления инструмента и оружия",

    "043.jpg": "Крепления мотоциклетных ящиков",

    "048.jpg": "баки мотоциклов",

    "052.jpg": "Бронещит",

    "056.jpg": "Ящик мотоцикла",

    "061.jpg": "Характерные немецкие болты",

    "063.jpg": "Ленивцы танков",

    "065.jpg": "Колесо пехотные тележки",

    "066.jpg": "Траки полугусеничных машин и танков",

    "072.jpg": "Люк с красной грунтовкой",

    "073.jpg": "Вентиляционная решетка танка",

    "074.jpg": "Балансиры гусеничных машин",

    "078.jpg": "Поворотные кулаки",

    "079.jpg": "Петля люка",

    "080.jpg": "опорный каток"

};


/*
====================================================
СОЗДАНИЕ СПИСКА ФОТОГРАФИЙ
====================================================
*/

const photos = [];


for (
    let i = 0;
    i < photoFiles.length;
    i++
) {

    const file =
        photoFiles[i];


    photos.push({

        file:
            "photos/" + file,

        filename:
            file,

        number:
            i + 1,

        caption:
            getCaption(i)

    });

}


/*
====================================================
ПОЛУЧЕНИЕ ОПИСАНИЯ
====================================================

Ищем ближайшую предыдущую фотографию,
для которой задано новое описание.
====================================================
*/

function getCaption(photoIndex) {

    let currentCaption = "";

    for (
        let i = 0;
        i <= photoIndex;
        i++
    ) {

        const filename =
            photoFiles[i];


        if (
            captions[filename] !== undefined
        ) {

            currentCaption =
                captions[filename];

        }

    }


    return currentCaption;

}


/*
====================================================
ЭЛЕМЕНТЫ СТРАНИЦЫ
====================================================
*/

let current = 0;


const photo =
    document.getElementById("photo");


const caption =
    document.getElementById("caption");


const counter =
    document.getElementById("counter");


const thumbs =
    document.getElementById("thumbs");


const gallery =
    document.getElementById("gallery");


/*
====================================================
СОЗДАНИЕ БОЛЬШОЙ ГАЛЕРЕИ
====================================================
*/

let currentGroup = null;


photos.forEach(
    (item, index) => {


        /*
        Новая группа начинается,
        когда меняется описание.
        */

        if (
            currentGroup === null ||
            currentGroup.caption !== item.caption
        ) {


            currentGroup = {

                caption:
                    item.caption,

                container:
                    document.createElement("div"),

                grid:
                    document.createElement("div")

            };


            currentGroup.container
                .className =
                "gallery-group";


            const title =
                document.createElement("div");


            title.className =
                "gallery-group-title";


            title.textContent =
                item.caption;


            currentGroup.grid
                .className =
                "gallery-grid";


            currentGroup.container
                .appendChild(title);


            currentGroup.container
                .appendChild(
                    currentGroup.grid
                );


            gallery.appendChild(
                currentGroup.container
            );

        }


        /*
        Создаём фотографию
        */

        const img =
            document.createElement("img");


        img.src =
            item.file;


        img.loading =
            "lazy";


        img.className =
            "gallery-item";


        img.alt =
            item.caption;


        img.dataset.index =
            index;


        img.onclick =
            function() {

                showPhoto(index);

            };


        currentGroup.grid
            .appendChild(img);

    }
);


/*
====================================================
СОЗДАНИЕ НИЖНЕЙ ЛЕНТЫ
====================================================
*/

photos.forEach(
    (item, index) => {


        const img =
            document.createElement("img");


        img.src =
            item.file;


        img.loading =
            "lazy";


        img.onclick =
            function() {

                showPhoto(index);

            };


        thumbs.appendChild(img);

    }
);


/*
====================================================
ПОКАЗАТЬ ФОТОГРАФИЮ
====================================================
*/

function showPhoto(index) {


    if (index < 0) {

        index =
            photos.length - 1;

    }


    if (index >= photos.length) {

        index = 0;

    }


    current = index;


    const item =
        photos[current];


    /*
    Основная фотография
    */

    photo.src =
        item.file;


    photo.alt =
        item.caption;


    /*
    Описание
    */

    caption.textContent =
        item.caption;


    /*
    Счётчик
    */

    counter.textContent =
        "Фото " +
        (current + 1) +
        " из " +
        photos.length;


    /*
    ==================================================
    АКТИВНАЯ МИНИАТЮРА В НИЖНЕЙ ЛЕНТЕ
    ==================================================
    */

    document
        .querySelectorAll(".thumbs img")
        .forEach((img, i) => {

            img.classList.toggle(

                "active",

                i === current

            );

        });


    /*
    ==================================================
    ПРОКРУТКА НИЖНЕЙ ЛЕНТЫ
    ==================================================
    */

    const activeThumb =
        thumbs.children[current];


    if (activeThumb) {

        activeThumb.scrollIntoView({

            behavior: "smooth",

            inline: "center",

            block: "nearest"

        });

    }


    /*
    ==================================================
    АКТИВНАЯ ФОТОГРАФИЯ
    В БОЛЬШОЙ ГАЛЕРЕЕ
    ==================================================
    */

    document
        .querySelectorAll(".gallery-item")
        .forEach((img, i) => {

            img.classList.toggle(

                "active",

                i === current

            );

        });

}


/*
====================================================
СЛЕДУЮЩАЯ ФОТОГРАФИЯ
====================================================
*/

function nextPhoto() {

    showPhoto(
        current + 1
    );

}


/*
====================================================
ПРЕДЫДУЩАЯ ФОТОГРАФИЯ
====================================================
*/

function previousPhoto() {

    showPhoto(
        current - 1
    );

}


/*
====================================================
КЛАВИАТУРА
====================================================
*/

document.addEventListener(
    "keydown",
    function(event) {


        if (
            event.key ===
            "ArrowRight"
        ) {

            nextPhoto();

        }


        if (
            event.key ===
            "ArrowLeft"
        ) {

            previousPhoto();

        }

    }
);


/*
====================================================
ЛИСТАНИЕ ПАЛЬЦЕМ
====================================================
*/

let startX = 0;

let startY = 0;


photo.addEventListener(

    "touchstart",

    function(event) {


        startX =
            event.changedTouches[0]
            .screenX;


        startY =
            event.changedTouches[0]
            .screenY;

    },

    {
        passive: true
    }

);


photo.addEventListener(

    "touchend",

    function(event) {


        const endX =
            event.changedTouches[0]
            .screenX;


        const endY =
            event.changedTouches[0]
            .screenY;


        const differenceX =
            endX - startX;


        const differenceY =
            endY - startY;


        if (

            Math.abs(differenceX) > 60 &&

            Math.abs(differenceX) >
            Math.abs(differenceY)

        ) {


            if (
                differenceX < 0
            ) {

                nextPhoto();

            }

            else {

                previousPhoto();

            }

        }

    },

    {
        passive: true
    }

);


/*
====================================================
ЗАПУСК
====================================================
*/

showPhoto(0);


</script>


</body>
    </html>
