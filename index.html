<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Другие детали тоже нужны, тут собраны самые характерные.</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    text-align: center;
    padding: 15px;
    background: #181818;
    position: sticky;
    top: 0;
    z-index: 10;
}

h1 {
    margin: 0 0 5px;
    font-size: 21px;
}

#counter {
    color: #aaa;
    font-size: 14px;
}

.top-controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
}

.top-controls button {
    background: #303030;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 14px;
}

.top-controls button:active {
    transform: scale(.96);
}


/* ==================================================
   ОСНОВНАЯ ФОТОГРАФИЯ
================================================== */

.viewer {

    padding:
        15px
        10px
        20px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: flex-start;
}

#caption {

    width: 100%;

    max-width: 900px;

    text-align: center;

    font-size: 18px;

    line-height: 1.5;

    margin-bottom: 15px;

    padding: 0 10px;

    color: #eee;
}

#photo {

    width: 100%;

    height: auto;

    max-width: 100%;

    border-radius: 5px;

    user-select: none;

    -webkit-user-drag: none;
}


/* ==================================================
   БОЛЬШАЯ ГАЛЕРЕЯ
================================================== */

.gallery {

    width: 100%;

    padding:
        20px
        10px
        100px;
}


/* Группа фотографий одного типа */

.gallery-group {

    margin-bottom: 30px;
}


/* Название группы */

.gallery-group-title {

    font-size: 18px;

    font-weight: bold;

    text-align: center;

    margin-bottom: 12px;

    color: #eee;
}


/* Четыре фотографии в ряд */

.gallery-grid {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 8px;
}


/* Фотография в большой галерее */

.gallery-item {

    width: 100%;

    aspect-ratio: 1 / 1;

    object-fit: cover;

    border-radius: 5px;

    cursor: pointer;

    opacity: .75;

    border: 3px solid transparent;

    transition:
        opacity .15s,
        border-color .15s,
        transform .15s;
}


/* Наведение */

.gallery-item:hover {

    opacity: 1;

}


/* Выбранная фотография */

.gallery-item.active {

    opacity: 1;

    border: 3px solid white;

}


/* ==================================================
   ФИКСИРОВАННАЯ НИЖНЯЯ ЛЕНТА
================================================== */

.thumbs {

    position: fixed;

    bottom: 0;

    left: 0;

    right: 0;

    background: #181818;

    display: flex;

    gap: 6px;

    overflow-x: auto;

    padding: 7px;

    z-index: 20;
}

.thumbs img {

    width: 62px;

    height: 62px;

    flex: 0 0 62px;

    object-fit: cover;

    border-radius: 5px;

    opacity: .55;
}

.thumbs img.active {

    opacity: 1;

    outline: 2px solid white;
}


/* ==================================================
   МОБИЛЬНЫЙ ЭКРАН
================================================== */

@media (max-width: 600px) {

    .gallery-grid {

        grid-template-columns:
            repeat(4, 1fr);

        gap: 5px;

    }

    .gallery-item {

        border-width: 2px;

    }

}

</style>

</head>


<body>


<header>

<h1>Другие детали тоже нужны, тут собраны самые характерные.</h1>


<div class="top-controls">

<button onclick="previousPhoto()">
← Назад
</button>


<div id="counter">
Фото 1 из 80
</div>


<button onclick="nextPhoto()">
Вперёд →
</button>

</div>


</header>



<!-- ==================================================
     ОСНОВНАЯ ФОТОГРАФИЯ
================================================== -->

<div class="viewer">


<div id="caption">
</div>


<img
    id="photo"
    src="photos/001.jpg"
    alt="Фото 1"
>


</div>



<!-- ==================================================
     БОЛЬШАЯ ГАЛЕРЕЯ
================================================== -->

<div
    class="gallery"
    id="gallery">
</div>



<!-- ==================================================
     ФИКСИРОВАННАЯ НИЖНЯЯ ЛЕНТА
================================================== -->

<div
    class="thumbs"
    id="thumbs">
</div>



<script>


/*
====================================================
НАСТРОЙКА ПОДПИСЕЙ
====================================================
*/

const captions = {

    1: "Турели",

    6: "Крюк буксировочный",

    10: "Танковая фара и маскировочные фонари",

    24: "Ведущее колесо",

    27: "Ленивец гусеничной техники, 50 см",

    31: "Диск автомобиля",

    35: "Пехотная тележка",

    39: "Крепления инструмента и оружия",

    43: "Крепления мотоциклетных ящиков",

    48: "баки мотоциклов",

    52: "Бронещит",

    56: "Ящик мотоцикла",

    61: "Характерные немецкие болты",

    63: "Ленивцы танков",

    65: "Колесо пехотные тележки",

    66: "Траки полугусеничных машин и танков",

    72: "Люк с красной грунтовкой",

    73: "Вентиляционная решетка танка",

    74: "Балансиры гусеничных машин",

    78: "Поворотные кулаки",

    79: "Петля люка",

    80: "опорный каток"

};


/*
====================================================
КОЛИЧЕСТВО ФОТОГРАФИЙ
====================================================
*/

const TOTAL_PHOTOS = 80;


/*
====================================================
СОЗДАНИЕ СПИСКА ФОТОГРАФИЙ
====================================================
*/

const photos = [];


for (let i = 1; i <= TOTAL_PHOTOS; i++) {

    const number =
        String(i).padStart(3, "0");


    photos.push({

        file:
            "photos/" +
            number +
            ".jpg",

        number:
            i,

        caption:
            getCaption(i)

    });

}


/*
====================================================
ФУНКЦИЯ ПОЛУЧЕНИЯ ПОДПИСИ
====================================================
*/

function getCaption(photoNumber) {

    let currentCaption = "";


    for (const start in captions) {

        const startNumber =
            Number(start);


        if (startNumber <= photoNumber) {

            currentCaption =
                captions[start];

        }

    }


    return currentCaption;

}


/*
====================================================
ЭЛЕМЕНТЫ СТРАНИЦЫ
====================================================
*/

let current = 0;


const photo =
    document.getElementById("photo");


const caption =
    document.getElementById("caption");


const counter =
    document.getElementById("counter");


const thumbs =
    document.getElementById("thumbs");


const gallery =
    document.getElementById("gallery");


/*
====================================================
СОЗДАНИЕ БОЛЬШОЙ ГАЛЕРЕИ
====================================================

Каждая новая подпись начинает новую группу.
====================================================
*/

let currentGroup = null;


photos.forEach(
    (item, index) => {


        /*
        Если описание изменилось,
        создаём новую группу
        */

        if (
            currentGroup === null ||
            currentGroup.caption !== item.caption
        ) {


            currentGroup = {

                caption:
                    item.caption,

                container:
                    document.createElement("div"),

                grid:
                    document.createElement("div")

            };


            currentGroup.container
                .className =
                "gallery-group";


            const title =
                document.createElement("div");


            title.className =
                "gallery-group-title";


            title.textContent =
                item.caption;


            currentGroup.grid
                .className =
                "gallery-grid";


            currentGroup.container
                .appendChild(title);


            currentGroup.container
                .appendChild(
                    currentGroup.grid
                );


            gallery.appendChild(
                currentGroup.container
            );

        }



        /*
        Создаём фотографию
        */

        const img =
            document.createElement("img");


        img.src =
            item.file;


        img.loading =
            "lazy";


        img.className =
            "gallery-item";


        img.alt =
            item.caption;


        /*
        При нажатии переключаем
        основную фотографию
        */

        img.onclick =
            function() {

                showPhoto(index);

            };


        /*
        Запоминаем номер фотографии
        */

        img.dataset.index =
            index;


        currentGroup.grid
            .appendChild(img);

    }
);


/*
====================================================
СОЗДАНИЕ НИЖНИХ МИНИАТЮР
====================================================
*/

photos.forEach(
    (item, index) => {


        const img =
            document.createElement("img");


        img.src =
            item.file;


        img.loading =
            "lazy";


        img.onclick =
            function() {

                showPhoto(index);

            };


        thumbs.appendChild(img);

    }
);


/*
====================================================
ПОКАЗАТЬ ФОТОГРАФИЮ
====================================================
*/

function showPhoto(index) {


    if (index < 0) {

        index =
            photos.length - 1;

    }


    if (index >= photos.length) {

        index = 0;

    }


    current = index;


    const item =
        photos[current];


    /*
    Основная фотография
    */

    photo.src =
        item.file;


    photo.alt =
        item.caption;


    /*
    Описание
    */

    caption.textContent =
        item.caption;


    /*
    Счётчик
    */

    counter.textContent =
        "Фото " +
        (current + 1) +
        " из " +
        photos.length;



    /*
    ==================================================
    АКТИВНАЯ МИНИАТЮРА В НИЖНЕЙ ЛЕНТЕ
    ==================================================
    */

    document
        .querySelectorAll(".thumbs img")
        .forEach((img, i) => {

            img.classList.toggle(

                "active",

                i === current

            );

        });



    /*
    ==================================================
    ПРОКРУТКА НИЖНЕЙ ЛЕНТЫ
    ==================================================
    */

    const activeThumb =
        thumbs.children[current];


    if (activeThumb) {

        activeThumb.scrollIntoView({

            behavior: "smooth",

            inline: "center",

            block: "nearest"

        });

    }



    /*
    ==================================================
    АКТИВНАЯ ФОТОГРАФИЯ
    В БОЛЬШОЙ ГАЛЕРЕЕ
    ==================================================
    */

    document
        .querySelectorAll(".gallery-item")
        .forEach((img, i) => {

            img.classList.toggle(

                "active",

                i === current

            );

        });

}


/*
====================================================
СЛЕДУЮЩАЯ ФОТОГРАФИЯ
====================================================
*/

function nextPhoto() {

    showPhoto(
        current + 1
    );

}


/*
====================================================
ПРЕДЫДУЩАЯ ФОТОГРАФИЯ
====================================================
*/

function previousPhoto() {

    showPhoto(
        current - 1
    );

}


/*
====================================================
КЛАВИАТУРА
====================================================
*/

document.addEventListener(
    "keydown",
    function(event) {


        if (
            event.key ===
            "ArrowRight"
        ) {

            nextPhoto();

        }


        if (
            event.key ===
            "ArrowLeft"
        ) {

            previousPhoto();

        }


    }
);


/*
====================================================
ЛИСТАНИЕ ПАЛЬЦЕМ
====================================================
*/

let startX = 0;

let startY = 0;


photo.addEventListener(

    "touchstart",

    function(event) {


        startX =
            event.changedTouches[0]
            .screenX;


        startY =
            event.changedTouches[0]
            .screenY;


    },

    {
        passive: true
    }

);


photo.addEventListener(

    "touchend",

    function(event) {


        const endX =
            event.changedTouches[0]
            .screenX;


        const endY =
            event.changedTouches[0]
            .screenY;


        const differenceX =
            endX - startX;


        const differenceY =
            endY - startY;


        if (

            Math.abs(differenceX) > 60 &&

            Math.abs(differenceX) >
            Math.abs(differenceY)

        ) {


            if (
                differenceX < 0
            ) {

                nextPhoto();

            }

            else {

                previousPhoto();

            }


        }


    },

    {
        passive: true
    }

);


/*
====================================================
ЗАПУСК
====================================================
*/

showPhoto(0);


</script>


</body>
    </html>
