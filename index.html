<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Другие детали тоже нужны, тут собраны самые характерные.</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    text-align: center;
    padding: 15px;
    background: #181818;
    position: sticky;
    top: 0;
    z-index: 10;
}

h1 {
    margin: 0 0 5px;
    font-size: 21px;
}

#counter {
    color: #aaa;
    font-size: 14px;
}

.top-controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
}

.top-controls button {
    background: #303030;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 14px;
}

.top-controls button:active {
    transform: scale(.96);
}

.viewer {

    min-height: calc(100vh - 80px);

    padding:
        15px
        10px
        100px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: flex-control;
}

#caption {

    width: 100%;

    max-width: 900px;

    text-align: center;

    font-size: 18px;

    line-height: 1.5;

    margin-bottom: 15px;

    padding: 0 10px;

    color: #eee;
}

#photo {

    width: 100%;

    height: auto;

    max-width: 100%;

    border-radius: 5px;

    user-select: none;

    -webkit-user-drag: none;
    }

.thumbs {

    position: fixed;

    bottom: 0;

    left: 0;

    right: 0;

    background: #181818;

    display: flex;

    gap: 6px;

    overflow-x: auto;

    padding: 7px;

    z-index: 20;
}

.thumbs img {

    width: 62px;

    height: 62px;

    flex: 0 0 62px;

    object-fit: cover;

    border-radius: 5px;

    opacity: .55;
}

.thumbs img.active {

    opacity: 1;

    outline: 2px solid white;
}

</style>

</head>


<body>


<header>

<h1>Фотоальбом</h1>


<div class="top-controls">

<button onclick="previousPhoto()">
← Назад
</button>


<div id="counter">
Фото 1 из 80
</div>


<button onclick="nextPhoto()">
Вперёд →
</button>

</div>


</header>



<div class="viewer">


<div id="caption">
</div>


<img
    id="photo"
    src="photos/001.jpg"
    alt="Фото 1"
>


</div>



<div
    class="thumbs"
    id="thumbs">
</div>



<script>


/*
====================================================
НАСТРОЙКА ПОДПИСЕЙ
====================================================
*/

const captions = {

    1: "Турели",

    6: "Крюк буксировочный",

    10: "Фары",

    24: "Ведущее колесо",

    26: "Ленивец гусеничной техники, 50 см",

    31: "Диск автомобиля",

    35: "Пехотная тележка",

    39: "Крепления инструмента и оружия",

    43: "Крепления мотоциклетных ящиков",

    48: "баки мотоциклов",

    52: "Бронещит",

    56: "Ящик мотоцикла",
    61: "Характерные немецкие болты",
    63: "Ленивцы танков",
    65: "Колесо пехотные тележки", 
    66: "Траки полугусеничных машин и танков", 
    72: "Люк с красной грунтовкой", 
    73: "Вентиляционная решетка танка",
    74: "Балансиры гусеничных машин", 
    78: "Поворотные кулаки ", 
    79: "Петля люка", 
    80: "опорный каток"
};


/*
====================================================
КОЛИЧЕСТВО ФОТОГРАФИЙ
====================================================
*/

const TOTAL_PHOTOS = 80;


/*
====================================================
СОЗДАНИЕ СПИСКА ФОТОГРАФИЙ
====================================================
*/

const photos = [];


for (let i = 1; i <= TOTAL_PHOTOS; i++) {

    const number =
        String(i).padStart(3, "0");


    photos.push({

        file:
            "photos/" +
            number +
            ".jpg",

        number:
            i,

        caption:
            getCaption(i)

    });

}


/*
====================================================
ФУНКЦИЯ ПОЛУЧЕНИЯ ПОДПИСИ
====================================================
*/

function getCaption(photoNumber) {

    let currentCaption = "";


    for (const start in captions) {

        const startNumber =
            Number(start);


        if (startNumber <= photoNumber) {

            currentCaption =
                captions[start];

        }

    }


    return currentCaption;

}


/*
====================================================
ТЕКУЩАЯ ФОТОГРАФИЯ
====================================================
*/

let current = 0;


const photo =
    document.getElementById("photo");


const caption =
    document.getElementById("caption");


const counter =
    document.getElementById("counter");


const thumbs =
    document.getElementById("thumbs");


/*
====================================================
ПОКАЗАТЬ ФОТОГРАФИЮ
====================================================
*/

function showPhoto(index) {


    if (index < 0) {

        index =
            photos.length - 1;

    }


    if (index >= photos.length) {

        index = 0;

    }


    current = index;


    const item =
        photos[current];


    photo.src =
        item.file;


    photo.alt =
        item.caption;


    caption.textContent =
        item.caption;


    counter.textContent =
        "Фото " +
        (current + 1) +
        " из " +
        photos.length;


    document
        .querySelectorAll(".thumbs img")
        .forEach((img, i) => {

            img.classList.toggle(

                "active",

                i === current

            );

        });

}


/*
====================================================
СЛЕДУЮЩАЯ ФОТОГРАФИЯ
====================================================
*/

function nextPhoto() {

    showPhoto(
        current + 1
    );

}


/*
====================================================
ПРЕДЫДУЩАЯ ФОТОГРАФИЯ
====================================================
*/

function previousPhoto() {

    showPhoto(
        current - 1
    );

}


/*
====================================================
МИНИАТЮРЫ
====================================================
*/

photos.forEach(
    (item, index) => {


        const img =
            document.createElement("img");


        img.src =
            item.file;


        img.loading =
            "lazy";


        img.onclick =
            function() {

                showPhoto(index);

            };


        thumbs.appendChild(img);


    }
);


/*
====================================================
КЛАВИАТУРА
====================================================
*/

document.addEventListener(
    "keydown",
    function(event) {


        if (
            event.key ===
            "ArrowRight"
        ) {

            nextPhoto();

        }


        if (
            event.key ===
            "ArrowLeft"
        ) {

            previousPhoto();

        }


    }
);


/*
====================================================
ЛИСТАНИЕ ПАЛЬЦЕМ
====================================================
*/

let startX = 0;

let startY = 0;


photo.addEventListener(

    "touchstart",

    function(event) {


        startX =
            event.changedTouches[0]
            .screenX;


        startY =
            event.changedTouches[0]
            .screenY;


    },

    {
        passive: true
    }

);


photo.addEventListener(

    "touchend",

    function(event) {


        const endX =
            event.changedTouches[0]
            .screenX;


        const endY =
            event.changedTouches[0]
            .screenY;


        const differenceX =
            endX - startX;


        const differenceY =
            endY - startY;


        if (

            Math.abs(differenceX) > 60 &&

            Math.abs(differenceX) >
            Math.abs(differenceY)

        ) {


            if (
                differenceX < 0
            ) {

                nextPhoto();

            }

            else {

                previousPhoto();

            }


        }


    },

    {
        passive: true
    }

);


/*
====================================================
ЗАПУСК
====================================================
*/

showPhoto(0);


</script>


</body>
    </html>
