<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Другие детали тоже нужны, тут собраны самые характерные.</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
}

header{
    text-align:center;
    padding:15px;
    background:#181818;
    position:sticky;
    top:0;
    z-index:10;
}

h1{
    margin:0 0 5px;
    font-size:21px;
}

#counter{
    color:#aaa;
    font-size:14px;
}

.top-controls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
}

.top-controls button{
    background:#303030;
    color:white;
    border:1px solid #00ff44;
    border-radius:8px;
    padding:8px 12px;
    font-size:14px;
}

.top-controls button:active{
    transform:scale(.96);
}


/* ==================================================
   ОСНОВНАЯ ФОТОГРАФИЯ
================================================== */

.viewer{
    padding:15px 10px 20px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
}

#caption{
    width:100%;
    max-width:900px;

    text-align:center;

    font-size:21.6px;
    line-height:1.5;

    margin-bottom:15px;

    padding:0 10px;

    color:#eee;
}

.photo-container{
    width:100%;

    display:flex;

    justify-content:center;
    align-items:center;
}

#photo{
    width:100%;
    height:auto;

    max-width:100%;

    border-radius:5px;

    user-select:none;
    -webkit-user-drag:none;

    display:block;

    object-fit:contain;

    cursor:pointer;
}


/* ==================================================
   БОЛЬШАЯ ГАЛЕРЕЯ
================================================== */

.gallery{
    width:100%;

    padding:20px 10px 100px;
}

.gallery-group{
    margin-bottom:30px;
}

.gallery-group-title{
    font-size:21.6px;
    font-weight:bold;

    text-align:center;

    margin-bottom:12px;

    color:#eee;
}

.gallery-grid{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:8px;
}

.gallery-item{
    width:100%;

    aspect-ratio:1/1;

    object-fit:cover;

    border-radius:5px;

    cursor:pointer;

    opacity:.75;

    border:3px solid transparent;

    transition:
        opacity .15s,
        border-color .15s;
}

.gallery-item:hover{
    opacity:1;
}

.gallery-item.active{
    opacity:1;

    border:3px solid white;
}


/* ==================================================
   НИЖНЯЯ ФИКСИРОВАННАЯ ЛЕНТА
================================================== */

.thumbs{
    position:fixed;

    bottom:0;
    left:0;
    right:0;

    background:#181818;

    display:flex;

    gap:6px;

    overflow-x:auto;

    padding:7px;

    z-index:20;

    border:1px solid #00ff44;
}

.thumbs img{
    width:62px;
    height:62px;

    flex:0 0 62px;

    object-fit:cover;

    border-radius:5px;

    opacity:.55;

    cursor:pointer;
}

.thumbs img.active{
    opacity:1;

    outline:2px solid white;
}


/* ==================================================
   ПОЛНОЭКРАННЫЙ ПРОСМОТР
================================================== */

#fullscreen{

    position:fixed;

    top:0;
    left:0;
    right:0;
    bottom:0;

    width:100vw;
    height:100vh;

    background:rgba(0,0,0,.70);

    display:none;

    align-items:center;
    justify-content:center;

    z-index:99999;

    padding:5px;

    overflow:hidden;

    cursor:pointer;

    touch-action:manipulation;
}

#fullscreen.show{
    display:flex;
}

#fullscreen img{

    display:block;

    width:100vw;
    height:100vh;

    max-width:100vw;
    max-height:100vh;

    object-fit:contain;

    border-radius:3px;

    user-select:none;

    -webkit-user-drag:none;

    cursor:pointer;

    touch-action:manipulation;
}


/* ==================================================
   МОБИЛЬНЫЙ ЭКРАН
================================================== */

@media(max-width:600px){

    .gallery-grid{

        grid-template-columns:
            repeat(4,1fr);

        gap:5px;
    }

    .gallery-item{

        border-width:2px;
    }

}

</style>

</head>


<body>


<header>

<h1>
Другие детали тоже нужны, тут собраны самые характерные.
</h1>


<div class="top-controls">

<button onclick="previousPhoto()">
← Назад
</button>


<div id="counter">
Фото 1 из 80
</div>


<button onclick="nextPhoto()">
Вперёд →
</button>

</div>

</header>



<!-- ==================================================
     ОСНОВНАЯ ФОТОГРАФИЯ
================================================== -->

<div class="viewer">

<div id="caption">
</div>

<div class="photo-container">

<img
    id="photo"
    src=""
    alt="Фото 1"
>

</div>

</div>



<!-- ==================================================
     БОЛЬШАЯ ГАЛЕРЕЯ ПЛИТКОЙ
================================================== -->

<div
    class="gallery"
    id="gallery">
</div>



<!-- ==================================================
     НИЖНЯЯ ГОРИЗОНТАЛЬНАЯ ЛЕНТА
================================================== -->

<div
    class="thumbs"
    id="thumbs">
</div>



<!-- ==================================================
     ПОЛНОЭКРАННОЕ ОКНО
================================================== -->

<div id="fullscreen">

<img
    id="fullscreenPhoto"
    src=""
    alt=""
>

</div>



<script>


/* ==================================================
   ОСНОВНЫЕ НАСТРОЙКИ
================================================== */

const TOTAL_PHOTOS = 80;



/* ==================================================
   ДОПОЛНИТЕЛЬНЫЕ ФОТОГРАФИИ
================================================== */

const extraPhotos = {

    68:["a","b"]

};



/* ==================================================
   ПОДПИСИ
================================================== */

const captions = {

    1:"Турели",

    6:"Крюк буксировочный",

    10:"Танковая фара и маскировочные фонари",

    24:"Ведущее колесо",

    27:"Ленивец гусеничной техники, 50 см",

    31:"Диск автомобиля",

    35:"Пехотная тележка",

    39:"Крепления инструмента и оружия",

    43:"Крепления мотоциклетных ящиков",

    48:"баки мотоциклов",

    52:"Бронещит",

    56:"Ящик мотоцикла",

    61:"Характерные немецкие болты",

    63:"Ленивцы танков",

    65:"Колесо пехотные тележки",

    66:"Траки полугусеничных машин и танков",

    72:"Люк с красной грунтовкой",

    73:"Вентиляционная решетка танка",

    74:"Балансиры гусеничных машин",

    78:"Поворотные кулаки",

    79:"Петля люка",

    80:"опорный каток"

};



/* ==================================================
   СОЗДАНИЕ СПИСКА ФАЙЛОВ
================================================== */

const photoFiles = [];


for(
    let i=1;
    i<=TOTAL_PHOTOS;
    i++
){

    const number =
        String(i).padStart(3,"0");


    photoFiles.push(
        number + ".jpg"
    );


    if(
        extraPhotos[i]
    ){

        extraPhotos[i].forEach(
            letter => {

                photoFiles.push(

                    number +
                    letter +
                    ".jpg"

                );

            }
        );

    }

}



/* ==================================================
   ПОЛУЧЕНИЕ ПОДПИСИ
================================================== */

function getCaption(photoIndex){

    let currentCaption = "";


    const filename =
        photoFiles[photoIndex];


    const match =
        filename.match(/^(\d{3})/);


    if(!match){

        return "";

    }


    const baseNumber =
        Number(match[1]);


    for(
        const start in captions
    ){

        const startNumber =
            Number(start);


        if(
            startNumber <= baseNumber
        ){

            currentCaption =
                captions[start];

        }

    }


    return currentCaption;

}



/* ==================================================
   СОЗДАНИЕ ОБЪЕКТОВ ФОТОГРАФИЙ
================================================== */

const photos = [];


photoFiles.forEach(
    (file,index) => {

        photos.push({

            file:
                "photos/" + file,

            filename:
                file,

            number:
                index + 1,

            caption:
                getCaption(index)

        });

    }
);



/* ==================================================
   ЭЛЕМЕНТЫ СТРАНИЦЫ
================================================== */

let current = 0;


const photo =
    document.getElementById("photo");


const caption =
    document.getElementById("caption");


const counter =
    document.getElementById("counter");


const thumbs =
    document.getElementById("thumbs");


const gallery =
    document.getElementById("gallery");


const fullscreen =
    document.getElementById("fullscreen");


const fullscreenPhoto =
    document.getElementById("fullscreenPhoto");



/* ==================================================
   БОЛЬШАЯ ГАЛЕРЕЯ
================================================== */

let currentGroup = null;


photos.forEach(
    (item,index) => {


        if(
            currentGroup === null ||
            currentGroup.caption !== item.caption
        ){

            currentGroup = {

                caption:
                    item.caption,

                container:
                    document.createElement("div"),

                grid:
                    document.createElement("div")

            };


            currentGroup.container.className =
                "gallery-group";


            const title =
                document.createElement("div");


            title.className =
                "gallery-group-title";


            title.textContent =
                item.caption;


            currentGroup.grid.className =
                "gallery-grid";


            currentGroup.container.appendChild(
                title
            );


            currentGroup.container.appendChild(
                currentGroup.grid
            );


            gallery.appendChild(
                currentGroup.container
            );

        }


        const img =
            document.createElement("img");


        img.src =
            item.file;


        img.loading =
            "lazy";


        img.className =
            "gallery-item";


        img.alt =
            item.caption;


        img.dataset.index =
            index;


        img.onclick =
            function(){

                showPhoto(index);

                openFullscreen(
                    item.file
                );

            };


        currentGroup.grid.appendChild(
            img
        );

    }
);



/* ==================================================
   НИЖНЯЯ ЛЕНТА
================================================== */

photos.forEach(
    (item,index) => {


        const img =
            document.createElement("img");


        img.src =
            item.file;


        img.loading =
            "lazy";


        img.onclick =
            function(){

                showPhoto(index);

            };


        thumbs.appendChild(
            img
        );

    }
);



/* ==================================================
   ПОДГОНКА ОСНОВНОЙ ФОТОГРАФИИ
================================================== */

function fitPhotoToScreen(){


    const screenHeight =
        window.innerHeight;


    const headerHeight =
        document.querySelector("header")
        .offsetHeight;


    const captionHeight =
        caption.offsetHeight;


    const availableHeight =
        screenHeight -
        headerHeight -
        captionHeight -
        55;


    photo.style.maxHeight =
        "none";


    photo.style.width =
        "100%";


    photo.style.height =
        "auto";


    const naturalWidth =
        photo.naturalWidth;


    const naturalHeight =
        photo.naturalHeight;


    if(
        !naturalWidth ||
        !naturalHeight
    ){

        return;

    }


    const availableWidth =
        photo.parentElement
        .clientWidth;


    const naturalDisplayHeight =
        availableWidth *
        naturalHeight /
        naturalWidth;


    if(
        naturalDisplayHeight >
        availableHeight
    ){

        photo.style.width =
            "auto";


        photo.style.height =
            availableHeight + "px";


        photo.style.maxWidth =
            "100%";


        photo.style.objectFit =
            "contain";

    }

    else{

        photo.style.width =
            "100%";


        photo.style.height =
            "auto";

    }

}



/* ==================================================
   ПОКАЗ ФОТОГРАФИИ
================================================== */

function showPhoto(index){


    if(index < 0){

        index =
            photos.length - 1;

    }


    if(
        index >= photos.length
    ){

        index = 0;

    }


    current = index;


    const item =
        photos[current];


    photo.src =
        item.file;


    photo.alt =
        item.caption;


    caption.textContent =
        item.caption;


    counter.textContent =
        "Фото " +
        (current + 1) +
        " из " +
        photos.length;


    photo.onload =
        function(){

            fitPhotoToScreen();

        };


    /* Активная миниатюра нижней ленты */

    document
        .querySelectorAll(".thumbs img")
        .forEach(
            (img,i) => {

                img.classList.toggle(

                    "active",

                    i === current

                );

            }
        );


    /* Центрирование нижней миниатюры */

    const activeThumb =
        thumbs.children[current];


    if(activeThumb){

        activeThumb.scrollIntoView({

            behavior:"smooth",

            inline:"center",

            block:"nearest"

        });

    }


    /* Активная фотография большой галереи */

    document
        .querySelectorAll(".gallery-item")
        .forEach(
            (img,i) => {

                img.classList.toggle(

                    "active",

                    i === current

                );

            }
        );

}



/* ==================================================
   НАЖАТИЕ НА ОСНОВНУЮ ФОТОГРАФИЮ
================================================== */

photo.addEventListener(

    "click",

    function(){

        openFullscreen(
            photos[current].file
        );

    }

);



/* ==================================================
   ОТКРЫТИЕ ПОЛНОЭКРАННОГО ПРОСМОТРА
================================================== */

function openFullscreen(file){


    fullscreenPhoto.src =
        file;


    fullscreenPhoto.alt =
        "Полноэкранная фотография";


    fullscreen.classList.add(
        "show"
    );


    document.body.style.overflow =
        "hidden";


    /*
       Добавляем состояние истории,
       чтобы системная кнопка Android
       сначала закрывала фото.
    */

    if(
        !history.state ||
        history.state.fullscreen !== true
    ){

        history.pushState(

            {
                fullscreen:true
            },

            "",

            location.href

        );

    }

}



/* ==================================================
   ЗАКРЫТИЕ ПОЛНОЭКРАННОГО ПРОСМОТРА
================================================== */

function closeFullscreen(){


    if(
        !fullscreen.classList.contains("show")
    ){

        return;

    }


    fullscreen.classList.remove(
        "show"
    );


    fullscreenPhoto.src =
        "";


    document.body.style.overflow =
        "";

}



/* ==================================================
   СИСТЕМНАЯ КНОПКА "НАЗАД" ANDROID
================================================== */

window.addEventListener(

    "popstate",

    function(event){

        /*
           Если полноэкранное фото открыто,
           закрываем его и остаёмся
           на этой же странице.
        */

        if(
            fullscreen.classList.contains("show")
        ){

            closeFullscreen();

            /*
               Возвращаем состояние страницы,
               чтобы следующий Back уже
               действительно ушёл назад.
            */

            history.pushState(

                {
                    page:"album"
                },

                "",

                location.href

            );

        }

        /*
           Если полноэкранного фото нет,
           ничего не перехватываем.
           Браузер продолжает обычную
           навигацию назад.
        */

    }

);



/* ==================================================
   НАЖАТИЕ НА ЛЮБОЕ МЕСТО ПОЛНОЭКРАННОГО ОКНА
================================================== */

fullscreen.addEventListener(

    "click",

    function(){

        closeFullscreen();

    }

);



/* ==================================================
   RESIZE
================================================== */

window.addEventListener(

    "resize",

    function(){

        fitPhotoToScreen();

    }

);



/* ==================================================
   СЛЕДУЮЩАЯ ФОТОГРАФИЯ
================================================== */

function nextPhoto(){

    showPhoto(
        current + 1
    );

}



/* ==================================================
   ПРЕДЫДУЩАЯ ФОТОГРАФИЯ
================================================== */

function previousPhoto(){

    showPhoto(
        current - 1
    );

}



/* ==================================================
   КЛАВИАТУРА
================================================== */

document.addEventListener(

    "keydown",

    function(event){


        if(
            event.key === "Escape" &&
            fullscreen.classList.contains("show")
        ){

            closeFullscreen();

            return;

        }


        if(
            event.key === "ArrowRight"
        ){

            nextPhoto();

        }


        if(
            event.key === "ArrowLeft"
        ){

            previousPhoto();

        }

    }

);



/* ==================================================
   СВАЙП
================================================== */

let startX = 0;

let startY = 0;


photo.addEventListener(

    "touchstart",

    function(event){

        startX =
            event.changedTouches[0]
            .screenX;


        startY =
            event.changedTouches[0]
            .screenY;

    },

    {
        passive:true
    }

);


photo.addEventListener(

    "touchend",

    function(event){


        const endX =
            event.changedTouches[0]
            .screenX;


        const endY =
            event.changedTouches[0]
            .screenY;


        const differenceX =
            endX - startX;


        const differenceY =
            endY - startY;


        if(

            Math.abs(differenceX) > 60 &&

            Math.abs(differenceX) >
            Math.abs(differenceY)

        ){

            if(
                differenceX < 0
            ){

                nextPhoto();

            }

            else{

                previousPhoto();

            }

        }

    },

    {
        passive:true
    }

);



/* ==================================================
   ЗАПУСК
================================================== */

showPhoto(0);

</script>

</body>
  </html>
