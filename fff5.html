<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Другие детали тоже нужны, тут собраны самые характерные.</title>

<style>
*{box-sizing:border-box}

body{
margin:0;background:#111;color:#fff;
font-family:Arial,sans-serif
}

header{
position:sticky;top:0;z-index:10;
text-align:center;padding:15px;
background:#181818
}

h1{margin:0 0 5px;font-size:21px}

#counter{color:#aaa;font-size:17px}

.top-controls{
display:flex;align-items:center;
justify-content:center;gap:12px
}

.top-controls button{
background:#303030;color:#fff;
border:2px solid #00ff44;
border-radius:8px;
padding:8px 12px;font-size:17px
}

.viewer{
padding:15px 10px 20px;
display:flex;flex-direction:column;
align-items:center
}

#caption{
width:100%;max-width:900px;
text-align:center;font-size:22px;
line-height:1.5;margin-bottom:15px;
padding:0 10px;color:#eee
}

.photo-container{
width:100%;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden
}

#photo{
width:100%;height:auto;
max-width:100%;
border-radius:5px;
display:block;
object-fit:contain;
user-select:none;
-webkit-user-drag:none;
will-change:transform
}

/* ПЛИТОЧНАЯ ГАЛЕРЕЯ */

.gallery{
width:100%;
padding:20px 10px 100px
}

.gallery-group{margin-bottom:30px}

.gallery-group-title{
font-size:22px;font-weight:bold;
text-align:center;margin-bottom:12px;
color:#eee
}

.gallery-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:8px
}

.gallery-item{
width:100%;
aspect-ratio:1/1;
object-fit:cover;
border-radius:5px;
cursor:pointer;
opacity:.75;
border:3px solid transparent;
transition:opacity .15s,border-color .15s
}

.gallery-item.active{
opacity:1;
border-color:#fff
}

/* НИЖНЯЯ ФИКСИРОВАННАЯ ЛЕНТА */

.thumbs{
position:fixed;
bottom:0;left:0;right:0;
background:#181818;
display:flex;
gap:6px;
overflow-x:auto;
padding:7px;
z-index:20;
border:2px solid #00ff44
}

.thumbs img{
width:62px;height:62px;
flex:0 0 62px;
object-fit:cover;
border-radius:5px;
opacity:.55;
cursor:pointer
}

.thumbs img.active{
opacity:1;
outline:2px solid white
}

/* FULLSCREEN */

#fullscreen{
position:fixed;
inset:0;
display:none;
align-items:center;
justify-content:center;
z-index:99999;

background:rgba(0,0,0,.82);
backdrop-filter:blur(3px);
-webkit-backdrop-filter:blur(3px);

padding:0;
overflow:hidden;

/* КРИТИЧЕСКИ ВАЖНО */
touch-action:none;
pointer-events:auto;
user-select:none
}

#fullscreenPhoto{
display:block;
position:relative;
z-index:100000;

max-width:100vw;
max-height:100vh;

width:auto;
height:auto;

object-fit:contain;

user-select:none;
-webkit-user-drag:none;

pointer-events:none;

will-change:transform
}

@media(max-width:600px){

.gallery-grid{
grid-template-columns:repeat(4,1fr);
gap:5px
}

.gallery-item{
border-width:2px
}

}
</style>
</head>

<body>

<header>

<h1>
Другие детали тоже нужны, тут собраны самые характерные.
</h1>

<div class="top-controls">

<button onclick="previousPhoto()">
← Назад
</button>

<div id="counter">
Фото 1 из 80
</div>

<button onclick="nextPhoto()">
Вперёд →
</button>

</div>

</header>


<div class="viewer">

<div id="caption"></div>

<div class="photo-container">

<img id="photo" src="" alt="Фото 1">

</div>

</div>


<div class="gallery" id="gallery"></div>


<div class="thumbs" id="thumbs"></div>


<!-- FULLSCREEN -->

<div id="fullscreen">

<img id="fullscreenPhoto" src="" alt="">

</div>


<script>

/* =================================================
ОСНОВНЫЕ НАСТРОЙКИ
================================================= */

const TOTAL_PHOTOS=80;


/* =================================================
ДОПОЛНИТЕЛЬНЫЕ ФОТО
================================================= */

const extraPhotos={
68:["a","b"]
};


/* =================================================
ПОДПИСИ
================================================= */

const captions={

1:"Турели",

6:"Крюк буксировочный",

10:"Танковая фара и маскировочные фонари",

24:"Ведущее колесо",

27:"Ленивец гусеничной техники, 50 см",

31:"Диск автомобиля",

35:"Пехотная тележка",

39:"Крепления инструмента и оружия",

43:"Крепления мотоциклетных ящиков",

48:"баки мотоциклов",

52:"Бронещит",

56:"Ящик мотоцикла",

61:"Характерные немецкие болты",

63:"Ленивцы танков",

65:"Колесо пехотные тележки",

66:"Траки полугусеничных машин и танков",

72:"Люк с красной грунтовкой",

73:"Вентиляционная решетка танка",

74:"Балансиры гусеничных машин",

78:"Поворотные кулаки",

79:"Петля люка",

80:"опорный каток"

};


/* =================================================
СОЗДАНИЕ СПИСКА ФАЙЛОВ
================================================= */

const photoFiles=[];

for(let i=1;i<=TOTAL_PHOTOS;i++){

const n=String(i).padStart(3,"0");

photoFiles.push(n+".jpg");

if(extraPhotos[i]){

extraPhotos[i].forEach(letter=>{

photoFiles.push(
n+letter+".jpg"
);

});

}

}


/* =================================================
ПОДПИСЬ
================================================= */

function getCaption(index){

const match=
photoFiles[index].match(/^(\d{3})/);

if(!match)return"";

const n=Number(match[1]);

let result="";

for(const start in captions){

if(Number(start)<=n){

result=captions[start];

}

}

return result;

}


/* =================================================
МАССИВ ФОТОГРАФИЙ
================================================= */

const photos=
photoFiles.map((file,index)=>({

file:"photos/"+file,

filename:file,

number:index+1,

caption:getCaption(index)

}));


/* =================================================
ЭЛЕМЕНТЫ
================================================= */

let current=0;

let fullscreenOpen=false;

let fullscreenIndex=0;


const photo=
document.getElementById("photo");

const caption=
document.getElementById("caption");

const counter=
document.getElementById("counter");

const thumbs=
document.getElementById("thumbs");

const gallery=
document.getElementById("gallery");

const fullscreen=
document.getElementById("fullscreen");

const fullscreenPhoto=
document.getElementById("fullscreenPhoto");


/* =================================================
ПЛИТОЧНАЯ ГАЛЕРЕЯ
================================================= */

let group=null;

photos.forEach((item,index)=>{

if(
!group||
group.caption!==item.caption
){

group={

caption:item.caption,

container:
document.createElement("div"),

grid:
document.createElement("div")

};

group.container.className=
"gallery-group";

const title=
document.createElement("div");

title.className=
"gallery-group-title";

title.textContent=
item.caption;

group.grid.className=
"gallery-grid";

group.container.appendChild(title);

group.container.appendChild(
group.grid
);

gallery.appendChild(
group.container
);

}


const img=
document.createElement("img");

img.src=item.file;

img.loading="lazy";

img.className=
"gallery-item";

img.alt=item.caption;

img.dataset.index=index;


img.onclick=function(){

showPhoto(index);

openFullscreen(index);

};


group.grid.appendChild(img);

});


/* =================================================
НИЖНЯЯ ЛЕНТА
================================================= */

photos.forEach((item,index)=>{

const img=
document.createElement("img");

img.src=item.file;

img.loading="lazy";


/*
НИЖНЯЯ ЛЕНТА ТОЛЬКО
ПЕРЕКЛЮЧАЕТ ФОТО.
FULLSCREEN НЕ ОТКРЫВАЕТ.
*/

img.onclick=function(){

showPhoto(index);

};


thumbs.appendChild(img);

});


/* =================================================
ПОДГОНКА ОСНОВНОЙ ФОТОГРАФИИ
================================================= */

function fitPhotoToScreen(){

const available=
window.innerHeight-
document.querySelector("header").offsetHeight-
caption.offsetHeight-
55;

const w=
photo.parentElement.clientWidth;

if(
!photo.naturalWidth||
!photo.naturalHeight
)return;

const h=
w*
photo.naturalHeight/
photo.naturalWidth;


if(h>available){

photo.style.width="auto";

photo.style.height=
available+"px";

}else{

photo.style.width="100%";

photo.style.height="auto";

}

photo.style.maxWidth="100%";

}


/* =================================================
ПОКАЗ ФОТО
================================================= */

function showPhoto(index){

if(index<0){

index=photos.length-1;

}

if(index>=photos.length){

index=0;

}

current=index;

const item=photos[current];


photo.src=item.file;

photo.alt=item.caption;

caption.textContent=
item.caption;


counter.textContent=
"Фото "+
(current+1)+
" из "+
photos.length;


photo.onload=
function(){

fitPhotoToScreen();

};


/* НИЖНЯЯ ЛЕНТА */

document
.querySelectorAll(".thumbs img")
.forEach((img,i)=>{

img.classList.toggle(
"active",
i===current
);

});


const activeThumb=
thumbs.children[current];

if(activeThumb){

activeThumb.scrollIntoView({

behavior:"smooth",

inline:"center",

block:"nearest"

});

}


/* ПЛИТОЧНАЯ ГАЛЕРЕЯ */

document
.querySelectorAll(".gallery-item")
.forEach((img,i)=>{

img.classList.toggle(
"active",
i===current
);

});

}


/* =================================================
НАВИГАЦИЯ
================================================= */

function nextPhoto(){

showPhoto(current+1);

}

function previousPhoto(){

showPhoto(current-1);

}


/* =================================================
ОТКРЫТИЕ FULLSCREEN
================================================= */

function openFullscreen(index){

fullscreenIndex=index;

fullscreenOpen=true;


/*
Сначала устанавливаем изображение,
потом показываем слой.
*/

fullscreenPhoto.src=
photos[index].file;

fullscreenPhoto.style.transform=
"translateX(0)";

fullscreen.style.display=
"flex";


document.body.style.overflow=
"hidden";

}


/* =================================================
ЗАКРЫТИЕ FULLSCREEN
================================================= */

function closeFullscreen(){

fullscreenOpen=false;

fullscreen.style.display=
"none";

fullscreenPhoto.src="";

fullscreenPhoto.style.transform=
"translateX(0)";

document.body.style.overflow="";

}


/* =================================================
ВАЖНО:
FULLSCREEN ПОЛНОСТЬЮ ПЕРЕХВАТЫВАЕТ ТАП
================================================= */

/*
Используем pointerdown/pointerup,
а не обычный click.

Это предотвращает ситуацию,
когда тап после свайпа проходит
к элементам, находящимся под fullscreen.
*/

let fsPointerDownX=0;

let fsPointerDownY=0;

let fsPointerMoved=false;


fullscreen.addEventListener(
"pointerdown",
function(e){

if(!fullscreenOpen)return;

e.preventDefault();

e.stopPropagation();

fsPointerDownX=e.clientX;

fsPointerDownY=e.clientY;

fsPointerMoved=false;

},
true
);


fullscreen.addEventListener(
"pointermove",
function(e){

if(!fullscreenOpen)return;

const dx=
e.clientX-fsPointerDownX;

const dy=
e.clientY-fsPointerDownY;

if(
Math.abs(dx)>10&&
Math.abs(dx)>Math.abs(dy)
){

fsPointerMoved=true;

e.preventDefault();

e.stopPropagation();

}

},
true
);


fullscreen.addEventListener(
"pointerup",
function(e){

if(!fullscreenOpen)return;

e.preventDefault();

e.stopPropagation();


/*
Если это был обычный тап —
закрываем.

Если был свайп —
переключаем фотографию.
*/

if(!fsPointerMoved){

closeFullscreen();

return;

}


const dx=
e.clientX-fsPointerDownX;


if(Math.abs(dx)>60){

if(dx<0){

fullscreenNavigate(1);

}else{

fullscreenNavigate(-1);

}

}else{

fullscreenPhoto.style.transform=
"translateX(0)";

}


fsPointerMoved=false;

},
true
);


/*
Блокируем pointer-события
непосредственно на fullscreen-фото.
*/

fullscreenPhoto.addEventListener(
"pointerdown",
function(e){

e.preventDefault();

e.stopPropagation();

},
true
);

fullscreenPhoto.addEventListener(
"pointerup",
function(e){

e.preventDefault();

e.stopPropagation();

},
true
);


/* =================================================
FULLSCREEN СВАЙП
================================================= */

function fullscreenNavigate(direction){

let index=
fullscreenIndex+direction;


if(index<0){

index=photos.length-1;

}

if(index>=photos.length){

index=0;

}


/* Анимация */

const distance=
direction>0
?
-window.innerWidth
:
window.innerWidth;


fullscreenPhoto.style.transition=
"transform .18s ease";

fullscreenPhoto.style.transform=
"translateX("+distance+"px)";


setTimeout(function(){

fullscreenPhoto.style.transition=
"none";

fullscreenIndex=index;

current=index;

showPhoto(index);

fullscreenPhoto.src=
photos[index].file;

fullscreenPhoto.style.transform=
direction>0
?
"translateX("+window.innerWidth+"px)"
:
"translateX("+(-window.innerWidth)+"px)";


requestAnimationFrame(function(){

requestAnimationFrame(function(){

fullscreenPhoto.style.transition=
"transform .18s ease";

fullscreenPhoto.style.transform=
"translateX(0)";

});

});

},180);

}


/* =================================================
СИСТЕМНАЯ КНОПКА НАЗАД
================================================= */

history.pushState(
{album:true},
"",
location.href
);


window.addEventListener(
"popstate",
function(){

if(fullscreenOpen){

openFullscreen(fullscreenIndex);

history.pushState(
{album:true},
"",
location.href
);

}else{

history.back();

}

});


/* =================================================
КЛАВИАТУРА
================================================= */

document.addEventListener(
"keydown",
function(e){

if(fullscreenOpen){

if(e.key==="Escape"){

e.preventDefault();

closeFullscreen();

return;

}

if(e.key==="ArrowRight"){

e.preventDefault();

fullscreenNavigate(1);

return;

}

if(e.key==="ArrowLeft"){

e.preventDefault();

fullscreenNavigate(-1);

return;

}

return;

}


if(e.key==="ArrowRight"){

nextPhoto();

}

if(e.key==="ArrowLeft"){

previousPhoto();

}

});


/* =================================================
СВАЙП ОСНОВНОЙ ФОТОГРАФИИ
================================================= */

let startX=0;

let startY=0;

let mainSwiping=false;


photo.addEventListener(
"touchstart",
function(e){

startX=
e.changedTouches[0].screenX;

startY=
e.changedTouches[0].screenY;

mainSwiping=false;

},
{passive:true}
);


photo.addEventListener(
"touchmove",
function(e){

const dx=
e.changedTouches[0].screenX-
startX;

const dy=
e.changedTouches[0].screenY-
startY;


if(
Math.abs(dx)>10&&
Math.abs(dx)>Math.abs(dy)
){

mainSwiping=true;

e.preventDefault();

photo.style.transform=
"translateX("+
(dx*.25)+
"px)";

}

},
{passive:false}
);


photo.addEventListener(
"touchend",
function(e){

if(!mainSwiping)return;

const dx=
e.changedTouches[0].screenX-
startX;


photo.style.transition=
"transform .16s ease";


if(Math.abs(dx)>60){

photo.style.transform=
"translateX("+
(dx<0
?
-window.innerWidth*.25
:
window.innerWidth*.25)+
"px)";


setTimeout(function(){

photo.style.transition=
"none";

showPhoto(
current+
(dx<0?1:-1)
);

photo.style.transform=
"translateX(0)";

},160);

}else{

photo.style.transform=
"translateX(0)";

}


setTimeout(function(){

photo.style.transition=
"none";

},160);


mainSwiping=false;

},
{passive:true}
);


/* =================================================
ТАП ПО ОСНОВНОЙ ФОТОГРАФИИ
================================================= */

photo.addEventListener(
"click",
function(){

if(!mainSwiping){

openFullscreen(current);

}

});


/* =================================================
RESIZE
================================================= */

window.addEventListener(
"resize",
function(){

fitPhotoToScreen();

});


/* =================================================
ЗАПУСК
================================================= */

showPhoto(0);

</script>

</body>
  </html>
